  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"63e70c92-1897-4e39-a8d3-b236476f6af0\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"e6838b6c-9eb8-4ace-9a31-315966ca396b\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"4e258f22-1a13-4451-a11e-bde1525f5f67\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* =========================================================\n   Opplæring i nytt avvikssystem — Antenor OTG\n   Designsystem: blå/grønn, Hanken Grotesk + IBM Plex Mono\n   ========================================================= */\n\n:root {\n  /* Brand */\n  --blue:      #1f5fa8;\n  --blue-700:  #184c87;\n  --blue-2:    #3b82c4;\n  --green:     #1f8a5b;\n  --green-700: #176f49;\n\n  /* Phase accents */\n  --p1: #1f5fa8;\n  --p2: #3b82c4;\n  --p3: #1f8a5b;\n\n  /* Risk colors */\n  --risk-red:    #d64a4a;\n  --risk-orange: #e08a2e;\n  --risk-yellow: #e6c34a;\n  --risk-green:  #2faa6e;\n\n  /* Neutrals (cool slate) */\n  --ink:    #16202c;\n  --ink-2:  #3a4a5a;\n  --muted:  #6a7a8a;\n  --line:   #e2e8ef;\n  --line-2: #eef2f6;\n  --bg:     #f4f7fb;\n  --card:   #ffffff;\n  --tint:   #eef4fb;\n  --tint-g: #ecf6f0;\n\n  --radius: 16px;\n  --radius-sm: 10px;\n  --shadow-sm: 0 1px 2px rgba(20,40,70,.05), 0 1px 1px rgba(20,40,70,.04);\n  --shadow:    0 4px 16px rgba(20,45,80,.07), 0 1px 3px rgba(20,45,80,.05);\n  --shadow-lg: 0 18px 50px rgba(20,45,80,.13), 0 4px 12px rgba(20,45,80,.07);\n\n  --maxw: 1080px;\n  --font: \"Hanken Grotesk\", system-ui, sans-serif;\n  --mono: \"IBM Plex Mono\", ui-monospace, monospace;\n}\n\n* { box-sizing: border-box; }\n\nhtml { scroll-behavior: smooth; scroll-padding-top: 92px; }\n\nbody {\n  margin: 0;\n  font-family: var(--font);\n  color: var(--ink);\n  background: var(--bg);\n  font-size: 17px;\n  line-height: 1.6;\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4 { line-height: 1.15; margin: 0; font-weight: 700; letter-spacing: -.01em; }\np { margin: 0; text-wrap: pretty; }\na { color: var(--blue); }\n\n.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 28px; }\n\n/* ============ TOP BAR / ROLE SWITCH ============ */\n.topbar {\n  position: sticky; top: 0; z-index: 60;\n  background: rgba(255,255,255,.85);\n  backdrop-filter: saturate(180%) blur(14px);\n  -webkit-backdrop-filter: saturate(180%) blur(14px);\n  border-bottom: 1px solid var(--line);\n}\n.topbar-inner {\n  max-width: var(--maxw); margin: 0 auto; padding: 11px 28px;\n  display: flex; align-items: center; gap: 18px;\n}\n.tb-brand { display: flex; align-items: center; gap: 11px; font-weight: 700; letter-spacing: -.01em; }\n.tb-brand .dot {\n  width: 30px; height: 30px; border-radius: 9px; flex: none;\n  background: linear-gradient(135deg, var(--blue), var(--green));\n  display: grid; place-items: center; color: #fff;\n}\n.tb-brand small { display: block; font-weight: 500; font-size: 11.5px; color: var(--muted); letter-spacing: .02em; }\n.tb-title { font-size: 15px; line-height: 1.05; }\n\n.tb-spacer { flex: 1; }\n\n.tb-nav { display: flex; gap: 4px; }\n.tb-nav a {\n  font-size: 13.5px; font-weight: 600; color: var(--ink-2); text-decoration: none;\n  padding: 7px 11px; border-radius: 8px; white-space: nowrap;\n}\n.tb-nav a:hover { background: var(--tint); color: var(--blue); }\n\n/* ===== Mobile navigation (hamburger) ===== */\n.menu-toggle {\n  display: none; width: 44px; height: 44px; border-radius: 11px; border: 1px solid var(--line);\n  background: #fff; color: var(--ink); cursor: pointer; place-items: center; flex: none;\n}\n.menu-toggle svg { width: 23px; height: 23px; }\n.menu-toggle .x { display: none; }\n.menu-toggle[aria-expanded=\"true\"] .ham { display: none; }\n.menu-toggle[aria-expanded=\"true\"] .x { display: block; }\n\n.mobile-nav {\n  display: none; flex-direction: column; gap: 2px;\n  padding: 10px; border-top: 1px solid var(--line); background: #fff;\n  max-height: 72vh; overflow-y: auto; -webkit-overflow-scrolling: touch;\n}\n.mobile-nav.open { display: flex; }\n.mobile-nav a, .mobile-nav button {\n  font: inherit; text-align: left; text-decoration: none; color: var(--ink);\n  font-size: 16px; font-weight: 600; padding: 14px 14px; border-radius: 11px;\n  background: transparent; border: 0; cursor: pointer; display: flex; align-items: center; gap: 12px;\n  min-height: 50px;\n}\n.mobile-nav a .mn-ic, .mobile-nav button .mn-ic {\n  width: 30px; height: 30px; border-radius: 8px; background: var(--tint); color: var(--blue);\n  display: grid; place-items: center; flex: none;\n}\n.mobile-nav a .mn-ic svg, .mobile-nav button .mn-ic svg { width: 16px; height: 16px; }\n.mobile-nav a:active, .mobile-nav button:active { background: var(--tint); }\n.mobile-nav .mn-chev { margin-left: auto; color: var(--muted); width: 17px; height: 17px; flex: none; }\n.mobile-nav .mnav-divider { height: 1px; background: var(--line); margin: 9px 8px; }\n.mobile-nav .mnav-label { font-size: 11.5px; font-family: var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 6px 14px 2px; }\n.mobile-nav .mnav-action { color: var(--blue); }\n.mobile-nav .mnav-action .mn-ic { background: var(--blue); color: #fff; }\n\n/* Segmented role switch */\n.role-switch {\n  display: inline-flex; padding: 4px; gap: 3px;\n  background: #e9eef4; border-radius: 11px; border: 1px solid var(--line);\n}\n.role-switch button {\n  font: inherit; font-size: 13.5px; font-weight: 700;\n  border: 0; cursor: pointer; background: transparent; color: var(--ink-2);\n  padding: 7px 15px; border-radius: 8px; display: flex; align-items: center; gap: 7px;\n  transition: background .18s, color .18s, box-shadow .18s;\n}\n.role-switch button .ic { width: 16px; height: 16px; }\n.role-switch button[aria-pressed=\"true\"] { background: #fff; color: var(--blue); box-shadow: var(--shadow-sm); }\nbody[data-mode=\"ansatt\"] .role-switch button.r-ansatt[aria-pressed=\"true\"] { color: var(--green); }\n\n/* ============ MODE VISIBILITY ============ */\n.leder-only { display: revert; }\n.ansatt-only { display: none; }\nbody[data-mode=\"ansatt\"] .leder-only { display: none !important; }\nbody[data-mode=\"ansatt\"] .ansatt-only { display: revert; }\n\n/* ============ COVER ============ */\n.cover {\n  position: relative; overflow: hidden;\n  background:\n    radial-gradient(1100px 460px at 82% -8%, rgba(31,138,91,.16), transparent 60%),\n    radial-gradient(900px 520px at 8% 4%, rgba(31,95,168,.18), transparent 62%),\n    linear-gradient(160deg, #14375f 0%, #1f5fa8 52%, #1f8a5b 130%);\n  color: #fff;\n}\n.cover::after {\n  content: \"\"; position: absolute; inset: 0; pointer-events: none;\n  background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),\n                    linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);\n  background-size: 38px 38px; mask-image: radial-gradient(900px 500px at 70% 30%, #000, transparent 75%);\n}\n.cover-inner { position: relative; z-index: 1; max-width: var(--maxw); margin: 0 auto; padding: 54px 28px 60px; }\n\n.logo-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }\n.wordmark {\n  font-size: clamp(20px, 2.6vw, 26px); font-weight: 800; letter-spacing: -.015em; color: #fff;\n}\n.wordmark-x { color: rgba(255,255,255,.55); font-weight: 500; margin: 0 4px; }\n.logo-slot {\n  height: 50px; min-width: 150px; padding: 0 18px;\n  border: 1.5px dashed rgba(255,255,255,.45); border-radius: 10px;\n  display: flex; align-items: center; gap: 10px; color: rgba(255,255,255,.92);\n  font-family: var(--mono); font-size: 11.5px; letter-spacing: .02em;\n  background: rgba(255,255,255,.06);\n}\n.logo-slot strong { font-family: var(--font); font-size: 15px; letter-spacing: -.01em; }\n.logo-x { color: rgba(255,255,255,.5); font-size: 13px; }\n\n.cover-badge {\n  display: inline-flex; align-items: center; gap: 9px; margin-top: 40px;\n  background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.28);\n  padding: 7px 15px; border-radius: 999px; font-weight: 700; font-size: 13.5px;\n  backdrop-filter: blur(4px);\n}\n.cover-badge .pip { width: 9px; height: 9px; border-radius: 50%; background: #7ee0aa; box-shadow: 0 0 0 4px rgba(126,224,170,.25); }\n\n.cover h1 { font-size: clamp(34px, 6vw, 62px); margin-top: 18px; letter-spacing: -.025em; max-width: 16ch; }\n.cover .sub { font-size: clamp(18px, 2.4vw, 24px); margin-top: 16px; color: rgba(255,255,255,.92); font-weight: 500; max-width: 34ch; }\n\n.cover-meta { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 34px; }\n.cover-meta .chip {\n  background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22);\n  border-radius: 12px; padding: 12px 16px; min-width: 150px;\n}\n.cover-meta .chip .k { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.7); }\n.cover-meta .chip .v { font-weight: 700; font-size: 16px; margin-top: 3px; }\n\n/* ============ SECTIONS ============ */\nsection.block { padding: 64px 0; }\nsection.block.alt { background: #fff; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }\n\n.kicker {\n  display: inline-flex; align-items: center; gap: 9px;\n  font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase;\n  color: var(--blue); font-weight: 600; margin-bottom: 14px;\n}\n.kicker .n {\n  width: 26px; height: 26px; border-radius: 7px; background: var(--tint);\n  display: grid; place-items: center; color: var(--blue); font-family: var(--font); font-weight: 800; font-size: 14px;\n}\n.h2 { font-size: clamp(26px, 3.6vw, 38px); letter-spacing: -.02em; }\n.lead { font-size: 19px; color: var(--ink-2); margin-top: 14px; max-width: 60ch; }\n.section-head { margin-bottom: 36px; }\n\n/* ============ CARDS ============ */\n.card {\n  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);\n  box-shadow: var(--shadow-sm); padding: 26px;\n}\n.grid { display: grid; gap: 18px; }\n.g2 { grid-template-columns: repeat(2, 1fr); }\n.g3 { grid-template-columns: repeat(3, 1fr); }\n.g4 { grid-template-columns: repeat(4, 1fr); }\n\n.icon-badge {\n  width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center;\n  background: var(--tint); color: var(--blue); flex: none;\n}\n.icon-badge.green { background: var(--tint-g); color: var(--green); }\n.icon-badge svg { width: 24px; height: 24px; }\n\n/* Definition feature card */\n.def {\n  display: grid; grid-template-columns: 1.25fr 1fr; gap: 30px; align-items: stretch;\n}\n.def .big {\n  background: linear-gradient(160deg, #fff, var(--tint));\n  border: 1px solid var(--line); border-radius: var(--radius); padding: 30px;\n}\n.def .big .quote { font-size: clamp(20px, 2.6vw, 27px); font-weight: 700; letter-spacing: -.01em; line-height: 1.3; }\n.def .big .quote .hl { color: var(--blue); }\n.examples { display: grid; gap: 12px; align-content: start; }\n.ex {\n  display: flex; gap: 13px; align-items: flex-start; padding: 15px 16px;\n  background: #fff; border: 1px solid var(--line); border-radius: 12px;\n}\n.ex .icon-badge { width: 38px; height: 38px; border-radius: 10px; }\n.ex .icon-badge svg { width: 20px; height: 20px; }\n.ex b { display: block; font-size: 15.5px; }\n.ex span { font-size: 13.5px; color: var(--muted); }\n\n/* ============ PHASE FLOW (chevrons) ============ */\n.flow { display: flex; gap: 0; align-items: stretch; flex-wrap: wrap; }\n.chev {\n  --c: var(--blue);\n  position: relative; flex: 1 1 0; min-width: 250px;\n  background: #fff; border: 1px solid var(--line); border-left: 5px solid var(--c);\n  padding: 24px 26px 24px 24px; margin-right: 16px; margin-bottom: 16px;\n  border-radius: 12px; box-shadow: var(--shadow-sm);\n}\n.flow.chevmode .chev {\n  clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 50%, calc(100% - 22px) 100%, 0 100%, 22px 50%);\n  padding-left: 40px; margin-right: -10px; border: 0; border-radius: 0;\n  box-shadow: none;\n}\n.flow.chevmode .chev:first-child { clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 50%, calc(100% - 22px) 100%, 0 100%); padding-left: 26px; }\n.chev .ph-num {\n  font-family: var(--mono); font-size: 12px; letter-spacing: .1em; font-weight: 600;\n  color: var(--c); text-transform: uppercase; display: flex; align-items: center; gap: 8px;\n}\n.chev .ph-num .ic { width: 30px; height: 30px; border-radius: 8px; background: color-mix(in srgb, var(--c) 12%, #fff); display: grid; place-items: center; }\n.chev .ph-num .ic svg { width: 17px; height: 17px; color: var(--c); }\n.chev h3 { font-size: 19px; margin: 14px 0 7px; letter-spacing: -.01em; }\n.chev p { font-size: 14px; color: var(--ink-2); }\n.chev .who {\n  display: inline-flex; align-items: center; gap: 6px; margin-top: 14px;\n  font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px;\n}\n.who.ansatt { background: var(--tint-g); color: var(--green-700); }\n.who.leder { background: var(--tint); color: var(--blue-700); }\n\n/* responsibility legend */\n.legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 26px; align-items: center; }\n.legend .item { display: flex; align-items: center; gap: 9px; font-size: 14px; color: var(--ink-2); font-weight: 600; }\n.legend .sw { width: 26px; height: 14px; border-radius: 4px; }\n\n/* ============ DETAIL / PHASE PANELS ============ */\n.phase-panel { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); background: #fff; }\n.phase-panel + .phase-panel { margin-top: 26px; }\n.pp-head {\n  --c: var(--blue);\n  display: flex; align-items: center; gap: 16px; padding: 20px 24px;\n  background: linear-gradient(100deg, color-mix(in srgb, var(--c) 13%, #fff), #fff);\n  border-bottom: 1px solid var(--line); border-left: 6px solid var(--c);\n}\n.pp-head .pnum {\n  width: 44px; height: 44px; flex: none; border-radius: 11px; background: var(--c); color: #fff;\n  display: grid; place-items: center; font-weight: 800; font-size: 20px;\n}\n.pp-head .t .ttl { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }\n.pp-head .t .st { font-size: 13.5px; color: var(--muted); font-family: var(--mono); letter-spacing: .02em; }\n.pp-body { padding: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }\n.pp-body.single { grid-template-columns: 1fr; }\n\n.fields { display: grid; gap: 14px; align-content: start; }\n.field { display: flex; gap: 13px; align-items: flex-start; }\n.field .marker { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--blue)); margin-top: 7px; flex: none; }\n.field .fl { font-weight: 700; font-size: 15px; }\n.field .fd { font-size: 13.5px; color: var(--muted); }\n\n/* Screenshot frame */\n.shot { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); background: #fff; }\n.shot .bar {\n  display: flex; align-items: center; gap: 7px; padding: 9px 13px; background: #f1f4f8; border-bottom: 1px solid var(--line);\n}\n.shot .bar .d { width: 10px; height: 10px; border-radius: 50%; background: #cdd6e0; }\n.shot .bar .lbl { margin-left: 8px; font-family: var(--mono); font-size: 11px; color: var(--muted); }\n.shot img { display: block; width: 100%; height: auto; }\n.shot .cap { padding: 10px 14px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line-2); font-family: var(--mono); }\n\n.callout {\n  display: flex; gap: 14px; padding: 16px 18px; border-radius: 12px; margin-top: 4px;\n  background: var(--tint); border: 1px solid color-mix(in srgb, var(--blue) 18%, var(--line));\n}\n.callout .icon-badge { width: 38px; height: 38px; }\n.callout.green { background: var(--tint-g); border-color: color-mix(in srgb, var(--green) 18%, var(--line)); }\n.callout .ct b { font-size: 15px; }\n.callout .ct p { font-size: 14px; color: var(--ink-2); margin-top: 3px; }\n\n/* Two action buttons explainer */\n.btn-explain { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }\n.btn-card { display: flex; gap: 13px; align-items: flex-start; padding: 16px; border-radius: 12px; border: 1px solid var(--line); background: #fff; }\n.btn-card .sysbtn { width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; color: #fff; flex: none; }\n.btn-card .sysbtn svg { width: 22px; height: 22px; }\n.btn-card b { font-size: 15px; }\n.btn-card p { font-size: 13.5px; color: var(--muted); margin-top: 2px; }\n\n/* Risk rule chips */\n.risk-rules { display: grid; gap: 10px; margin-top: 6px; }\n.rrule { display: flex; align-items: center; gap: 13px; padding: 12px 15px; border-radius: 11px; border: 1px solid var(--line); background: #fff; }\n.rrule .sw { width: 18px; height: 18px; border-radius: 6px; flex: none; }\n.rrule .txt { font-size: 14px; }\n.rrule .txt b { font-weight: 700; }\n\n/* ============ AVVIK vs AKSJON diagram ============ */\n.link-diagram { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0; align-items: center; }\n.node {\n  border-radius: var(--radius); padding: 24px; border: 1px solid var(--line); background: #fff; box-shadow: var(--shadow);\n}\n.node.avvik { border-top: 5px solid var(--blue); }\n.node.aksjon { border-top: 5px solid var(--green); }\n.node .nh { display: flex; align-items: center; gap: 12px; }\n.node .nh .icon-badge { width: 42px; height: 42px; }\n.node .nh .t b { font-size: 18px; }\n.node .nh .t span { font-size: 12.5px; color: var(--muted); font-family: var(--mono); }\n.node ul { margin: 16px 0 0; padding: 0; list-style: none; display: grid; gap: 9px; }\n.node ul li { display: flex; gap: 10px; font-size: 14px; color: var(--ink-2); }\n.node ul li svg { width: 17px; height: 17px; color: var(--green); flex: none; margin-top: 3px; }\n\n.link-mid { display: grid; place-items: center; padding: 0 6px; }\n.link-mid .ring {\n  width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center;\n  background: #fff; border: 2px dashed var(--blue-2); color: var(--blue);\n}\n.link-mid .ring svg { width: 26px; height: 26px; }\n.link-mid .lbl { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-top: 8px; text-align: center; max-width: 90px; line-height: 1.3; }\n\n.lock-note {\n  margin-top: 22px; display: flex; gap: 15px; align-items: center;\n  background: linear-gradient(100deg, #fff6ec, #fff); border: 1px solid #f0d9b8; border-radius: 14px; padding: 18px 20px;\n}\n.lock-note .icon-badge { width: 48px; height: 48px; background: #fbe9cf; color: #b9791e; }\n.lock-note b { color: #8a5a14; font-size: 16px; }\n.lock-note p { font-size: 14.5px; color: var(--ink-2); margin-top: 3px; }\n\n/* ============ TIPS ============ */\n.tip { padding: 22px; border-radius: 14px; border: 1px solid var(--line); background: #fff; box-shadow: var(--shadow-sm); }\n.tip .icon-badge { margin-bottom: 14px; }\n.tip h4 { font-size: 16.5px; margin-bottom: 6px; }\n.tip p { font-size: 14px; color: var(--ink-2); }\n\n/* ============ TIMELINE (etter sending) ============ */\n.timeline { position: relative; margin-top: 8px; padding-left: 8px; }\n.tstep { position: relative; display: grid; grid-template-columns: 52px 1fr; gap: 18px; padding-bottom: 26px; }\n.tstep:last-child { padding-bottom: 0; }\n.tstep .num {\n  width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; z-index: 1;\n  font-weight: 800; font-size: 18px; color: #fff; background: var(--blue);\n}\n.tstep:nth-child(2) .num { background: var(--blue-2); }\n.tstep:nth-child(3) .num { background: color-mix(in srgb, var(--blue-2) 60%, var(--green)); }\n.tstep:nth-child(4) .num { background: var(--green); }\n.tstep::before {\n  content: \"\"; position: absolute; left: 21px; top: 44px; bottom: -6px; width: 2px; background: var(--line);\n}\n.tstep:last-child::before { display: none; }\n.tstep .body { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow-sm); }\n.tstep .body h4 { font-size: 16px; }\n.tstep .body p { font-size: 14px; color: var(--ink-2); margin-top: 4px; }\n\n/* ============ FAQ ============ */\n.faq { display: grid; gap: 12px; }\ndetails.qa {\n  background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 4px 6px;\n  box-shadow: var(--shadow-sm); overflow: hidden;\n}\ndetails.qa summary {\n  list-style: none; cursor: pointer; padding: 16px 18px; font-weight: 700; font-size: 16.5px;\n  display: flex; align-items: center; gap: 13px; color: var(--ink);\n}\ndetails.qa summary::-webkit-details-marker { display: none; }\ndetails.qa summary .plus {\n  margin-left: auto; width: 26px; height: 26px; border-radius: 7px; background: var(--tint); color: var(--blue);\n  display: grid; place-items: center; font-size: 19px; transition: transform .22s; flex: none;\n}\ndetails.qa[open] summary .plus { transform: rotate(45deg); }\ndetails.qa .ans { padding: 0 18px 18px 57px; font-size: 14.5px; color: var(--ink-2); }\ndetails.qa summary .qn { width: 30px; height: 30px; border-radius: 8px; background: var(--tint); color: var(--blue); display: grid; place-items: center; font-family: var(--mono); font-size: 13px; font-weight: 700; flex: none; }\n\n/* ============ CONTACT ============ */\n.contact {\n  display: grid; grid-template-columns: auto 1fr; gap: 26px; align-items: center;\n  background: linear-gradient(150deg, #14375f, #1f5fa8 70%, #1f8a5b 150%); color: #fff;\n  border-radius: var(--radius); padding: 32px; box-shadow: var(--shadow-lg);\n}\n.contact .avatar {\n  width: 84px; height: 84px; border-radius: 20px; background: rgba(255,255,255,.16);\n  border: 1.5px solid rgba(255,255,255,.3); display: grid; place-items: center; font-size: 30px; font-weight: 800;\n}\n.contact h3 { font-size: 22px; }\n.contact .role { font-size: 14px; color: rgba(255,255,255,.85); font-family: var(--mono); margin-top: 2px; }\n.contact .rows { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }\n.contact .rows a, .contact .rows span {\n  display: inline-flex; align-items: center; gap: 9px; text-decoration: none; color: #fff;\n  background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.22);\n  padding: 9px 15px; border-radius: 10px; font-weight: 600; font-size: 14.5px;\n}\n.contact .rows svg { width: 17px; height: 17px; }\n\n/* ============ INFO PILL ============ */\n.mode-note {\n  display: flex; gap: 14px; align-items: flex-start; padding: 18px 20px; border-radius: 14px;\n  background: var(--tint-g); border: 1px solid color-mix(in srgb, var(--green) 22%, var(--line)); margin-top: 22px;\n}\n.mode-note .icon-badge { background: #fff; }\n.mode-note b { font-size: 16px; }\n.mode-note p { font-size: 14.5px; color: var(--ink-2); margin-top: 3px; }\n\n/* ============ FOOTER ============ */\nfooter.foot { background: #11202f; color: rgba(255,255,255,.72); padding: 38px 0; font-size: 14px; }\nfooter.foot .wrap { display: flex; justify-content: space-between; gap: 18px; flex-wrap: wrap; align-items: center; }\nfooter.foot .brand { display: flex; align-items: center; gap: 11px; color: #fff; font-weight: 700; }\nfooter.foot .brand .dot { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--blue), var(--green)); }\nfooter.foot a { color: #9fc3ea; }\n\n/* print button */\n.print-btn {\n  display: inline-flex; align-items: center; gap: 8px; font: inherit; font-weight: 700; font-size: 13px;\n  cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--ink-2);\n  padding: 8px 13px; border-radius: 9px;\n}\n.print-btn:hover { border-color: var(--blue); color: var(--blue); }\n.print-btn svg { width: 16px; height: 16px; }\n\n/* ============ RESPONSIVE ============ */\n.topbar-inner { min-width: 0; }\n/* Skjul desktop-navigasjon + verktøyknapper før de presser siden bredere enn\n   skjermen, og vis hamburger-menyen i stedet (gjelder begge håndbøkene). */\n@media (max-width: 1120px) {\n  .tb-nav, .tb-title { display: none; }\n  .tb-desktop { display: none !important; }\n  .menu-toggle { display: grid; }\n}\n@media (max-width: 880px) {\n  body { font-size: 16px; }\n  .g2, .g3, .g4, .def, .pp-body, .link-diagram, .contact, .btn-explain { grid-template-columns: 1fr; }\n  .link-mid { padding: 14px 0; }\n  .link-mid .ring { transform: rotate(90deg); }\n  .role-switch button { min-height: 42px; }\n  .flow.chevmode .chev { clip-path: none !important; padding-left: 24px; margin-right: 0; border-radius: 12px; border: 1px solid var(--line); border-left: 5px solid var(--c); box-shadow: var(--shadow-sm); }\n}\n@media (max-width: 560px) {\n  .cover-inner { padding: 38px 22px 44px; }\n  .wrap, .topbar-inner { padding-left: 18px; padding-right: 18px; }\n  .topbar-inner { gap: 12px; }\n  .role-switch { padding: 3px; }\n  .role-switch button { padding: 8px 12px; min-height: 42px; }\n  section.block { padding: 44px 0; }\n  .lead { font-size: 16.5px; }\n  .cover .sub { font-size: 17px; }\n  .section-head { margin-bottom: 26px; }\n  .cover-meta .chip { flex: 1 1 calc(50% - 7px); min-width: 0; }\n  .card { padding: 20px; }\n}\n\n/* ============ PRINT ============ */\n@media print {\n  :root { --shadow: none; --shadow-sm: none; --shadow-lg: none; }\n  body { background: #fff; font-size: 11pt; }\n  .topbar, .tb-nav, .print-btn, .role-switch { position: static; }\n  .topbar { box-shadow: none; }\n  section.block { padding: 22px 0; break-inside: avoid-page; }\n  .cover { -webkit-print-color-adjust: exact; print-color-adjust: exact; }\n  .phase-panel, .card, .chev, .tip, .node, .contact, details.qa { break-inside: avoid; }\n  .no-print { display: none !important; }\n}\n<\u002Fstyle>\n<\u002Fhead>\n\n<body data-mode=\"leder\">\n\n<!-- ============ TOP BAR ============ -->\n<div class=\"topbar no-print\">\n  <div class=\"topbar-inner\">\n    <div class=\"tb-brand\">\n      <span class=\"dot\">\n        <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3l8 4v5c0 4.5-3.2 7.5-8 9-4.8-1.5-8-4.5-8-9V7z\"><\u002Fpath><path d=\"M9 12l2 2 4-4\"><\u002Fpath><\u002Fsvg>\n      <\u002Fspan>\n      <div class=\"tb-title\">\n        Avvikssystem\n        <small>Antenor OTG · Opplæring<\u002Fsmall>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <nav class=\"tb-nav\">\n      <a href=\"#avvik\">Hva er avvik<\u002Fa>\n      <a href=\"#faser\">De tre fasene<\u002Fa>\n      <a href=\"#detaljer\">Gjennomgang<\u002Fa>\n      <a href=\"#aksjoner\">Aksjoner<\u002Fa>\n      <a href=\"#etter\" class=\"ansatt-only\">Etter sending<\u002Fa>\n      <a href=\"#tips\">Tips<\u002Fa>\n      <a href=\"#faq\">FAQ<\u002Fa>\n    <\u002Fnav>\n\n    <div class=\"tb-spacer\"><\u002Fdiv>\n\n    <button class=\"print-btn tb-desktop\" onclick=\"window.print()\" title=\"Skriv ut / lagre som PDF\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 9V3h12v6\"><\u002Fpath><path d=\"M6 18H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2\"><\u002Fpath><rect x=\"6\" y=\"14\" width=\"12\" height=\"7\" rx=\"1\"><\u002Frect><\u002Fsvg>\n      PDF\n    <\u002Fbutton>\n\n    <a class=\"pri x=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 11.1V12a10 10 0 1 1-5.9-9.1\"><\u002Fpath><path d=\"M9 11l3 3 9-9\"><\u002Fpath><\u002Fsvg><\u002Fspan> Aksjoner <svg class=\"mn-chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m9 18 6-6-6-6\"><\u002Fpath><\u002Fsvg><\u002Fa>\n    <a href=\"#etter\" class=\"ansatt-only\" onclick=\"closeMenu()\"><span class=\"mn-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 8v4l3 2\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><\u002Fsvg><\u002Fspan> Etter sending <svg class=\"mn-chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m9 18 6-6-6-6\"><\u002Fpath><\u002Fsvg><\u002Fa>\n    <a href=\"#tips\" onclick=\"closeMenu()\"><span class=\"mn-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z\"><\u002Fpath><\u002Fsvg><\u002Fspan> Tips <svg class=\"mn-chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m9 18 6-6-6-6\"><\u002Fpath><\u002Fsvg><\u002Fa>\n    <a href=\"#faq\" onclick=\"closeMenu()\"><span class=\"mn-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.7M12 17h.01\"><\u002Fpath><\u002Fsvg><\u002Fspan> Ofte stilte spørsmål <svg class=\"mn-chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m9 18 6-6-6-6\"><\u002Fpath><\u002Fsvg><\u002Fa>\n    <div class=\"mnav-divider\"><\u002Fdiv>\n    <a class=\"mnav-action\" href=\"index.html\"><span class=\"mn-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"><\u002Frect><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"><\u002Frect><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"><\u002Frect><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"><\u002Frect><\u002Fsvg><\u002Fspan> Åpne systemoversikten<\u002Fa>\n    <button class=\"mnav-action\" onclick=\"window.print()\"><span class=\"mn-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 9V3h12v6\"><\u002Fpath><path d=\"M6 18H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2\"><\u002Fpath><rect x=\"6\" y=\"14\" width=\"12\" height=\"7\" rx=\"1\"><\u002Frect><\u002Fsvg><\u002Fspan> Skriv ut / lagre som PDF<\u002Fbutton>\n  <\u002Fnav>\n<\u002Fdiv>\n\n<!-- ============ COVER ============ -->\n<header class=\"cover\">\n  <div class=\"cover-inner\">\n    <div class=\"logo-row\">\n      <div class=\"wordmark\">Antenor ABMS <span class=\"wordmark-x\">–<\u002Fspan> Ramberg<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"cover-badge\">\n      <span class=\"pip\"><\u002Fspan>\n      <span>Opplæringsmal · <span id=\"mode-label\">Leder (full versjon)<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n\n    <h1>Opplæring i nytt avvikssystem<\u002Fh1>\n    <p class=\"sub\">Enkel og effektiv avvikshåndtering — fra registrering til lukket avvik.<\u002Fp>\n\n    <div class=\"cover-meta\">\n      <div class=\"chip\"><div class=\"k\">Bedrift<\u002Fdiv><div class=\"v\">Ramberg<\u002Fdiv><\u002Fdiv>\n      <div class=\"chip\"><div class=\"k\">System<\u002Fdiv><div class=\"v\">Avvik &amp; Aksjon<\u002Fdiv><\u002Fdiv>\n      <div class=\"chip\"><div class=\"k\">Leverandør<\u002Fdiv><div class=\"v\">Antenor OTG<\u002Fdiv><\u002Fdiv>\n      <div class=\"chip\"><div class=\"k\">Versjon<\u002Fdiv><div class=\"v\" id=\"mode-version\">Leder<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ============ MODE INTRO (changes per role) ============ -->\n<div class=\"wrap\">\n  <div class=\"mode-note leder-only\" style=\"margin-top:30px\">\n    <span class=\"icon-badge green\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 8v4l3 2\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n    <div><b>Du leser leder-versjonen.<\u002Fb><p>Den dekker hele løpet: registrering, klassifisering, årsaksanalyse, tiltak, verifisering og lukking — pluss hvordan avvik og aksjoner henger sammen. Vil du se den forenklede versjonen for ansatte? Bytt rolle øverst til høyre.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"mode-note ansatt-only\" style=\"margin-top:30px\">\n    <span class=\"icon-badge green\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 2 11 13\"><\u002Fpath><path d=\"M22 2 15 22l-4-9-9-4z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n    <div><b>Du leser ansatt-versjonen.<\u002Fb><p>Din jobb er å fange opp avviket og registrere det riktig i <b>Fase 1<\u002Fb> — så sender du det videre til nærmeste leder. Leder tar seg av fase 2 og 3. Denne malen viser deg akkurat det du trenger.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ 1 · HVA ER ET AVVIK ============ -->\n<section class=\"block\" id=\"avvik\">\n  <div class=\"wrap\">\n    <div class=\"section-head\">\n      <span class=\"kicker\"><span class=\"n\">1<\u002Fspan> Grunnleggende<\u002Fspan>\n      <h2 class=\"h2\">Hva er et avvik?<\u002Fh2>\n      <p class=\"lead\">Før du registrerer er det greit å vite hva vi mener med et avvik — og hvorfor det er verdifullt at nettopp du melder fra.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"def\">\n      <div class=\"big\">\n        <span class=\"icon-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.3 3.2 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.2a2 2 0 0 0-3.4 0z\"><\u002Fpath><path d=\"M12 9v4\"><\u002Fpath><path d=\"M12 17h.01\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <p class=\"quote\" style=\"margin-top:18px\">Et avvik er en <span class=\"hl\">hendelse, tilstand eller handling<\u002Fspan> som bryter med krav, prosedyrer, lover eller forventet kvalitet — eller som kunne ha ført til skade.<\u002Fp>\n        <p style=\"margin-top:16px; color:var(--ink-2); font-size:15px\">Å melde avvik handler ikke om å finne syndebukker. Det handler om å lære, rette opp og hindre at det samme skjer igjen. Hvert avvik gjør oss litt tryggere og litt bedre.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"examples\">\n        <div class=\"ex\">\n          <span class=\"icon-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3l8 4v5c0 4.5-3.2 7.5-8 9-4.8-1.5-8-4.5-8-9V7z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <div><b>Sikkerhetsbrudd<\u002Fb><span>F.eks. tralle som ikke er sikret og sklir ut av stilling.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ex\">\n          <span class=\"icon-badge green\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <div><b>Kvalitetsavvik<\u002Fb><span>Produkt eller leveranse som ikke møter kravene.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ex\">\n          <span class=\"icon-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2v4\"><\u002Fpath><circle cx=\"12\" cy=\"13\" r=\"8\"><\u002Fcircle><path d=\"M12 13l3-2\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <div><b>Nestenulykke<\u002Fb><span>Det gikk bra denne gangen — men kunne gått galt.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ex\">\n          <span class=\"icon-badge green\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2.5 1.5 5-1 8a7 7 0 0 1-6 10z\"><\u002Fpath><path d=\"M2 22c1.5-3 4-5 9-6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <div><b>Miljø &amp; ytre forhold<\u002Fb><span>Søl, utslipp eller forhold som påvirker omgivelsene.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 2 · DE TRE FASENE ============ -->\n<section class=\"block alt\" id=\"faser\">\n  <div class=\"wrap\">\n    <div class=\"section-head\">\n      <span class=\"kicker\"><span class=\"n\">2<\u002Fspan> Kjernen i systemet<\u002Fspan>\n      <h2 class=\"h2\">De tre hovedfasene i avviksregistrering<\u002Fh2>\n      <p class=\"lead\">Hvert avvik beveger seg gjennom tre faser. Fargene følger deg gjennom hele dokumentet, så du alltid vet hvor i løpet du er.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"flow chevmode\">\n      <div class=\"chev\" style=\"--c:var(--p1)\">\n        <div class=\"ph-num\"><span class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"><\u002Fpath><path d=\"M14 2v6h6\"><\u002Fpath><path d=\"M8 13h8M8 17h6\"><\u002Fpath><\u002Fsvg><\u002Fspan> Fase 1<\u002Fdiv>\n        <h3>Generell informasjon om hendelsen<\u002Fh3>\n        <p>Hva skjedde, hvor og når? Beskriv hendelsen og legg ved bilder. Dette er starten på alt.<\u002Fp>\n        <span class=\"who ansatt\">Utføres av ansatt<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"chev\" style=\"--c:var(--p2)\">\n        <div class=\"ph-num\"><span class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 6h18M3 12h18M3 18h12\"><\u002Fpath><circle cx=\"19\" cy=\"18\" r=\"2.4\"><\u002Fcircle><\u002Fsvg><\u002Fspan> Fase 2<\u002Fdiv>\n        <h3>Klassifisering + årsak, konsekvens &amp; tiltak<\u002Fh3>\n        <p>Avviket vurderes (risiko), rotårsaken finnes, og tiltak settes for å rette opp og forebygge.<\u002Fp>\n        <span class=\"who leder\">Utføres av leder<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"chev\" style=\"--c:var(--p3)\">\n        <div class=\"ph-num\"><span class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 11l3 3 8-8\"><\u002Fpath><path d=\"M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9\"><\u002Fpath><\u002Fsvg><\u002Fspan> Fase 3<\u002Fdiv>\n        <h3>Verifisering av avvikets tiltak<\u002Fh3>\n        <p>Virket tiltaket? Leder bekrefter at tiltakene er gjennomført og effektive — og lukker avviket.<\u002Fp>\n        <span class=\"who leder\">Utføres av leder<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"legend\">\n      <div class=\"item\"><span class=\"sw\" style=\"background:var(--p1)\"><\u002Fspan> Fase 1 — Registrering<\u002Fdiv>\n      <div class=\"item\"><span class=\"sw\" style=\"background:var(--p2)\"><\u002Fspan> Fase 2 — Behandling<\u002Fdiv>\n      <div class=\"item\"><span class=\"sw\" style=\"background:var(--p3)\"><\u002Fspan> Fase 3 — Verifisering &amp; lukking<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"mode-note ansatt-only\">\n      <span class=\"icon-badge green\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"m12 5 7 7-7 7\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <div><b>Din rolle stopper etter Fase 1.<\u002Fb><p>Du fyller ut Fase 1 og sender avviket til nærmeste leder. Fase 2 og 3 håndteres av leder — men det er fint å vite hva som skjer videre.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 3 · DETALJERT GJENNOMGANG ============ -->\n<section class=\"block\" id=\"detaljer\">\n  <div class=\"wrap\">\n    <div class=\"section-head\">\n      <span class=\"kicker\"><span class=\"n\">3<\u002Fspan> Steg for steg<\u002Fspan>\n      <h2 class=\"h2\">Detaljert gjennomgang av fasene<\u002Fh2>\n      <p class=\"lead ansatt-only\">Slik fyller du ut Fase 1 riktig — feltene under er nøyaktig de du møter i systemet.<\u002Fp>\n      <p class=\"lead leder-only\">Hva som skal fylles ut i hver fase, med skjermbilder fra det faktiske systemet.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- FASE 1 -->\n    <div class=\"phase-panel\">\n      <div class=\"pp-head\" style=\"--c:var(--p1)\">\n        <span class=\"pnum\">1<\u002Fspan>\n        <div class=\"t\"><div class=\"ttl\">Generell informasjon om hendelsen<\u002Fdiv><div class=\"st\">Fase 1 · registrering · alle ansatte<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pp-body\">\n        <div>\n          <div class=\"fields\" style=\"--c:var(--p1)\">\n            <div class=\"field\"><span class=\"marker\"><\u002Fspan><div><span class=\"fl\">Registrert av &amp; hendelsesdato<\u002Fspan><div class=\"fd\">Hvem melder, og når hendelsen skjedde.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"field\"><span class=\"marker\"><\u002Fspan><div><span class=\"fl\">Hendelsestype<\u002Fspan><div class=\"fd\">F.eks. «Sikkerhetsbrudd», kvalitet eller nestenulykke.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"field\"><span class=\"marker\"><\u002Fspan><div><span class=\"fl\">Beskriv hendelsen<\u002Fspan><div class=\"fd\">Kort og konkret: hva skjedde, hvor og hvordan. Skriv så en kollega forstår.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"field\"><span class=\"marker\"><\u002Fspan><div><span class=\"fl\">Umiddelbare tiltak utført<\u002Fspan><div class=\"fd\">Hva du gjorde der og da for å sikre situasjonen.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"field\"><span class=\"marker\"><\u002Fspan><div><span class=\"fl\">Vedlegg / bilder<\u002Fspan><div class=\"fd\">Legg gjerne ved foto — det gjør avviket mye lettere å forstå.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"btn-explain\">\n            <div class=\"btn-card\">\n              <span class=\"sysbtn\" style=\"background:var(--green)\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 2 11 13\"><\u002Fpath><path d=\"M22 2 15 22l-4-9-9-4z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n              <div><b>Send videre<\u002Fb><p>Grønn papirfly-knapp sender avviket til noen andre for behandling — typisk din leder.<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"btn-card leder-only\">\n              <span class=\"sysbtn\" style=\"background:var(--green-700)\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n              <div><b>Behandle selv<\u002Fb><p>Grønn knapp lar deg behandle avviket selv, hvis du har mulighet og rettigheter.<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"btn-card ansatt-only\">\n              <span class=\"sysbtn\" style=\"background:var(--blue)\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2\"><\u002Fpath><circle cx=\"10\" cy=\"7\" r=\"3.5\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n              <div><b>Til nærmeste leder<\u002Fb><p>Som ansatt velger du «send videre» og sender avviket til din leder.<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <div class=\"shot\">\n            <div class=\"bar\"><span class=\"d\"><\u002Fspan><span class=\"d\"><\u002Fspan><span class=\"d\"><\u002Fspan><span class=\"lbl\">Fase 1 — Generell informasjon<\u002Fspan><\u002Fdiv>\n            <img src=\"e7c0afa9-20d1-487a-8af4-a32aff17752b\" alt=\"Skjermbilde av Fase 1 — Generell informasjon om hendelse\">\n            <div class=\"cap\">Skjermbilde fra systemet: Fase 1 slik den ser ut når du registrerer.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"callout green\" style=\"margin-top:16px\">\n            <span class=\"icon-badge green\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 16v-4\"><\u002Fpath><path d=\"M12 8h.01\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n            <div class=\"ct\"><b>Tips<\u002Fb><p>Fyll ut alle <b>nødvendige felter<\u002Fb> før du sender. Et godt beskrevet avvik blir behandlet raskere.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ANSATT: kort om fase 2 og 3 -->\n    <div class=\"phase-panel ansatt-only\" style=\"margin-top:26px\">\n      <div class=\"pp-head\" style=\"--c:var(--p2)\">\n        <span class=\"pnum\" style=\"background:var(--p2)\">2–3<\u002Fspan>\n        <div class=\"t\"><div class=\"ttl\">Fase 2 &amp; 3 — leder tar over<\u002Fdiv><div class=\"st\">Du trenger ikke gjøre noe mer<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pp-body single\">\n        <p style=\"font-size:15.5px; color:var(--ink-2)\">Når du har sendt avviket, overtar nærmeste leder. Leder <b>klassifiserer<\u002Fb> hendelsen, finner <b>rotårsaken<\u002Fb>, bestemmer <b>tiltak<\u002Fb> og <b>verifiserer<\u002Fb> at tiltakene virker før avviket lukkes. Du kan når som helst følge med på status i systemet — og du får beskjed hvis leder trenger mer informasjon fra deg.<\u002Fp>\n        <div class=\"callout\" style=\"margin-top:4px\">\n          <span class=\"icon-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 8v4l3 2\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n          <div class=\"ct\"><b>Vil du se hele løpet?<\u002Fb><p>Bytt til <b>leder-versjonen<\u002Fb> øverst for å se hvordan fase 2 og 3 fylles ut i detalj.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- FASE 2 (LEDER) -->\n    <div class=\"phase-panel leder-only\" style=\"margin-top:26px\">\n      <div class=\"pp-head\" style=\"--c:var(--p2)\">\n        <span class=\"pnum\" style=\"background:var(--p2)\">2<\u002Fspan>\n        <div class=\"t\"><div class=\"ttl\">Klassifisering + årsaksanalyse, konsekvens &amp; tiltak<\u002Fdiv><div class=\"st\">Fase 2 · behandling · leder<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pp-body\">\n        <div>\n          <h4 style=\"font-size:16px; margin-bottom:10px\">Klassifisering av hendelse<\u002Fh4>\n          <div class=\"fields\" style=\"--c:var(--p2)\">\n            <div class=\"field\"><span class=\"marker\"><\u002Fspan><div><span class=\"fl\">Behandlet av &amp; dato<\u002Fspan><div class=\"fd\">Hvem som behandler avviket, og når.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"field\"><span class=\"marker\"><\u002Fspan><div><span class=\"fl\">Produkt · avdeling · prosess<\u002Fspan><div class=\"fd\">Hvor i driften hører avviket hjemme.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"field\"><span class=\"marker\"><\u002Fspan><div><span class=\"fl\">Kunde · leverandør · lokasjon<\u002Fspan><div class=\"fd\">Hvem og hvor avviket er knyttet til.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"field\"><span class=\"marker\"><\u002Fspan><div><span class=\"fl\">Kost &amp; risiko før aksjoner<\u002Fspan><div class=\"fd\">Anslått kostnad og risikonivå før tiltak settes inn.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"callout\" style=\"margin-top:18px; --c:var(--p2)\">\n            <span class=\"icon-badge\" style=\"background:#fdeaea; color:var(--risk-red)\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.3 3.2 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.2a2 2 0 0 0-3.4 0z\"><\u002Fpath><path d=\"M12 9v4M12 17h.01\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <div class=\"ct\"><b>Risiko styrer hva som kreves<\u002Fb>\n              <div class=\"risk-rules\">\n                <div class=\"rrule\"><span class=\"sw\" style=\"background:var(--risk-red)\"><\u002Fspan><span class=\"sw\" style=\"background:var(--risk-orange); margin-left:-8px\"><\u002Fspan><span class=\"txt\"><b>Rød eller oransje:<\u002Fb> krav om full årsaksbehandling og tiltak.<\u002Fspan><\u002Fdiv>\n                <div class=\"rrule\"><span class=\"sw\" style=\"background:var(--risk-yellow)\"><\u002Fspan><span class=\"sw\" style=\"background:var(--risk-green); margin-left:-8px\"><\u002Fspan><span class=\"txt\"><b>Gul eller grønn:<\u002Fb> krever kun klassifisering — lukk deretter som observasjon.<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <h4 style=\"font-size:16px; margin-bottom:10px\">Årsaksanalyse, konsekvens &amp; tiltak<\u002Fh4>\n          <div class=\"fields\" style=\"--c:var(--p2)\">\n            <div class=\"field\"><span class=\"marker\"><\u002Fspan><div><span class=\"fl\">Rotårsak<\u002Fspan><div class=\"fd\">Den egentlige årsaken — ikke bare symptomet.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"field\"><span class=\"marker\"><\u002Fspan><div><span class=\"fl\">Konsekvens<\u002Fspan><div class=\"fd\">Hva ble (eller kunne blitt) resultatet, f.eks. «nestenulykke».<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"field\"><span class=\"marker\"><\u002Fspan><div><span class=\"fl\">Kommentarer &amp; tiltak<\u002Fspan><div class=\"fd\">Tabell: rotårsaker → hvorfor → ansvarlig → tiltak.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"shot\" style=\"margin-top:18px\">\n            <div class=\"bar\"><span class=\"d\"><\u002Fspan><span class=\"d\"><\u002Fspan><span class=\"d\"><\u002Fspan><span class=\"lbl\">Fase 2 — Klassifisering &amp; årsak<\u002Fspan><\u002Fdiv>\n            <img src=\"b69d5966-ecfb-44b4-ba14-7be48afbd69f\" alt=\"Skjermbilde av Fase 2 — Klassifisering og årsaksanalyse\">\n            <div class=\"cap\">Skjermbilde fra systemet: Fase 2.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- FASE 3 (LEDER) -->\n    <div class=\"phase-panel leder-only\" style=\"margin-top:26px\">\n      <div class=\"pp-head\" style=\"--c:var(--p3)\">\n        <span class=\"pnum\" style=\"background:var(--p3)\">3<\u002Fspan>\n        <div class=\"t\"><div class=\"ttl\">Verifisering av avvikets tiltak<\u002Fdiv><div class=\"st\">Fase 3 · verifisering &amp; lukking · leder<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pp-body\">\n        <div>\n          <div class=\"fields\" style=\"--c:var(--p3)\">\n            <div class=\"field\"><span class=\"marker\"><\u002Fspan><div><span class=\"fl\">Verifisert av &amp; dato verifisert<\u002Fspan><div class=\"fd\">Hvem som bekrefter, og når.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"field\"><span class=\"marker\"><\u002Fspan><div><span class=\"fl\">Tiltak fullført<\u002Fspan><div class=\"fd\">Er alle tiltak faktisk gjennomført? (Ja/Nei)<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"field\"><span class=\"marker\"><\u002Fspan><div><span class=\"fl\">Tiltak effektivt?<\u002Fspan><div class=\"fd\">Virket tiltaket etter hensikten — eller overvåkes effekten videre?<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"field\"><span class=\"marker\"><\u002Fspan><div><span class=\"fl\">Risiko etter aksjoner<\u002Fspan><div class=\"fd\">Nytt risikonivå etter at tiltak er satt inn.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"callout green\" style=\"margin-top:18px\">\n            <span class=\"icon-badge green\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 11l3 3 8-8\"><\u002Fpath><path d=\"M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <div class=\"ct\"><b>Lukking<\u002Fb><p>Når tiltak er fullført og verifisert som effektive, kan avviket lukkes. Er en <b>aksjon<\u002Fb> knyttet til avviket, må den være utført og verifisert først — mer om dette i neste seksjon.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div class=\"shot\">\n            <div class=\"bar\"><span class=\"d\"><\u002Fspan><span class=\"d\"><\u002Fspan><span class=\"d\"><\u002Fspan><span class=\"lbl\">Fase 3 — Verifisering<\u002Fspan><\u002Fdiv>\n            <img src=\"51f52035-43b5-4196-b6e1-af2a6b3869c8\" alt=\"Skjermbilde av Fase 3 — Verifisering av avvikets tiltak\">\n            <div class=\"cap\">Skjermbilde fra systemet: Fase 3.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 4 · AKSJONER ============ -->\n<section class=\"block alt\" id=\"aksjoner\">\n  <div class=\"wrap\">\n    <div class=\"section-head\">\n      <span class=\"kicker\"><span class=\"n\">4<\u002Fspan> Viktig sammenheng<\u002Fspan>\n      <h2 class=\"h2\">Aksjoner i systemet<\u002Fh2>\n      <p class=\"lead\">«Aksjon» er en <b>egen modul<\u002Fb> — men tett koblet til avviket. Forstår du koblingen, forstår du hvorfor et avvik noen ganger ikke lar seg lukke.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"link-diagram\">\n      <div class=\"node avvik\">\n        <div class=\"nh\">\n          <span class=\"icon-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"><\u002Fpath><path d=\"M14 2v6h6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <div class=\"t\"><b>Avvik<\u002Fb><span>Hendelsen som meldes<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <ul>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg> Følger de tre fasene<\u002Fli>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg> Klassifiseres og analyseres<\u002Fli>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg> Lukkes i Fase 3<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <div class=\"link-mid\">\n        <div class=\"ring\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 17H7A5 5 0 0 1 7 7h2\"><\u002Fpath><path d=\"M15 7h2a5 5 0 0 1 0 10h-2\"><\u002Fpath><path d=\"M8 12h8\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div class=\"lbl\">Tett koblet<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"node aksjon\">\n        <div class=\"nh\">\n          <span class=\"icon-badge green\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 11.1V12a10 10 0 1 1-5.9-9.1\"><\u002Fpath><path d=\"M9 11l3 3 9-9\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <div class=\"t\"><b>Aksjon<\u002Fb><span>Egen, men tilknyttet oppgave<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <ul>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg> Opprettes i forbindelse med avviket<\u002Fli>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg> Tildeles en ansvarlig<\u002Fli>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg> Må utføres og verifiseres<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"lock-note\">\n      <span class=\"icon-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"><\u002Frect><path d=\"M8 11V7a4 4 0 0 1 8 0v4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <div>\n        <b>Avviket kan ikke lukkes før aksjonen er ferdig.<\u002Fb>\n        <p>Er det opprettet en aksjon på avviket, forblir avviket <b>låst i Fase 3<\u002Fb> til aksjonen er <b>utført og verifisert<\u002Fb>. Slik sikrer systemet at ingenting lukkes før jobben faktisk er gjort.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ETTER SENDING (ANSATT) ============ -->\n<section class=\"block ansatt-only\" id=\"etter\">\n  <div class=\"wrap\">\n    <div class=\"section-head\">\n      <span class=\"kicker\"><span class=\"n\">→<\u002Fspan> For ansatte<\u002Fspan>\n      <h2 class=\"h2\">Hva skjer etter at du har sendt avviket?<\u002Fh2>\n      <p class=\"lead\">Du har gjort din del. Her er hva som skjer videre — så du vet hva du kan forvente.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"timeline\">\n      <div class=\"tstep\">\n        <span class=\"num\">1<\u002Fspan>\n        <div class=\"body\"><h4>Avviket havner hos leder<\u002Fh4><p>Nærmeste leder får avviket til behandling med en gang du sender det.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tstep\">\n        <span class=\"num\">2<\u002Fspan>\n        <div class=\"body\"><h4>Leder klassifiserer og analyserer<\u002Fh4><p>Leder vurderer risiko, finner rotårsak og bestemmer hvilke tiltak som trengs.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tstep\">\n        <span class=\"num\">3<\u002Fspan>\n        <div class=\"body\"><h4>Tiltak settes i verk<\u002Fh4><p>Tiltak — og eventuelt en aksjon — tildeles en ansvarlig og gjennomføres.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tstep\">\n        <span class=\"num\">4<\u002Fspan>\n        <div class=\"body\"><h4>Verifisering og lukking<\u002Fh4><p>Når tiltakene er bekreftet effektive, lukkes avviket. Du kan følge status underveis.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ TIPS ============ -->\n<section class=\"block alt\" id=\"tips\">\n  <div class=\"wrap\">\n    <div class=\"section-head\">\n      <span class=\"kicker\"><span class=\"n\">★<\u002Fspan> Beste praksis<\u002Fspan>\n      <h2 class=\"h2\">Tips for god avviksregistrering<\u002Fh2>\n      <p class=\"lead\">Små vaner som gjør avvikene dine tydeligere — og behandlingen raskere.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"grid g3\">\n      <div class=\"tip\">\n        <span class=\"icon-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m21 21-4.3-4.3\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <h4>Vær konkret<\u002Fh4>\n        <p>Beskriv hva, hvor og hvordan. «Tralle skled ca. 20 cm fram» er bedre enn «noe gikk galt».<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tip\">\n        <span class=\"icon-badge green\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"><\u002Frect><path d=\"m8.5 12.5 2.5 2.5 4.5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <h4>Meld med en gang<\u002Fh4>\n        <p>Detaljene er ferskest rett etter hendelsen. Vent ikke til vakta er over.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tip\">\n        <span class=\"icon-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z\"><\u002Fpath><circle cx=\"12\" cy=\"13\" r=\"3.5\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n        <h4>Legg ved bilde<\u002Fh4>\n        <p>Ett foto sier mer enn ti setninger. Bilder gjør avviket lett å forstå for leder.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tip\">\n        <span class=\"icon-badge green\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 18V5l12-2v13\"><\u002Fpath><circle cx=\"6\" cy=\"18\" r=\"3\"><\u002Fcircle><circle cx=\"18\" cy=\"16\" r=\"3\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n        <h4>Skill fakta fra mening<\u002Fh4>\n        <p>Beskriv det som faktisk skjedde. Vurderinger og årsaker tar leder seg av.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tip\">\n        <span class=\"icon-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2 4 5v6c0 5 3.4 8.5 8 10 4.6-1.5 8-5 8-10V5z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <h4>Ingen skyld — bare læring<\u002Fh4>\n        <p>Avvik handler om å forbedre, ikke å henge ut. Meld trygt, også nestenulykker.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tip\">\n        <span class=\"icon-badge green\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 4h16v12H5.2L4 17.2z\"><\u002Fpath><path d=\"M8 9h8M8 12h5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <h4>Beskriv strakstiltak<\u002Fh4>\n        <p>Gjorde du noe for å sikre situasjonen? Skriv det under «Umiddelbare tiltak».<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ FAQ ============ -->\n<section class=\"block\" id=\"faq\">\n  <div class=\"wrap\">\n    <div class=\"section-head\">\n      <span class=\"kicker\"><span class=\"n\">?<\u002Fspan> Spørsmål &amp; svar<\u002Fspan>\n      <h2 class=\"h2\">Ofte stilte spørsmål<\u002Fh2>\n    <\u002Fdiv>\n\n    <div class=\"faq\">\n      <details class=\"qa\" open=\"\">\n        <summary><span class=\"qn\">01<\u002Fspan> Må jeg vite hva som er årsaken før jeg melder?<span class=\"plus\">+<\u002Fspan><\u002Fsummary>\n        <div class=\"ans\">Nei. Som ansatt beskriver du bare hva som skjedde i Fase 1. Rotårsak og tiltak er leders jobb i Fase 2.<\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"qa\">\n        <summary><span class=\"qn\">02<\u002Fspan> Hva er forskjellen på et avvik og en aksjon?<span class=\"plus\">+<\u002Fspan><\u002Fsummary>\n        <div class=\"ans\">Avviket er selve hendelsen som meldes og behandles gjennom de tre fasene. En aksjon er en egen oppgave som kan knyttes til avviket — og avviket kan ikke lukkes før aksjonen er utført og verifisert.<\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"qa\">\n        <summary><span class=\"qn\">03<\u002Fspan> Hvor sender jeg avviket?<span class=\"plus\">+<\u002Fspan><\u002Fsummary>\n        <div class=\"ans\">Bruk den grønne papirfly-knappen for å sende avviket videre — som ansatt sender du det til din nærmeste leder.<\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"qa\">\n        <summary><span class=\"qn\">04<\u002Fspan> Hva betyr fargene på risiko?<span class=\"plus\">+<\u002Fspan><\u002Fsummary>\n        <div class=\"ans\">Rød og oransje risiko krever full årsaksbehandling og tiltak. Gul og grønn risiko krever kun klassifisering, og avviket lukkes deretter som en observasjon.<\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"qa\">\n        <summary><span class=\"qn\">05<\u002Fspan> Kan jeg følge med på avviket etter at jeg har sendt det?<span class=\"plus\">+<\u002Fspan><\u002Fsummary>\n        <div class=\"ans\">Ja. Du finner avviket igjen i systemet og kan se status mens leder behandler det. Du får beskjed dersom leder trenger mer informasjon.<\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"qa leder-only\">\n        <summary><span class=\"qn\">06<\u002Fspan> Når kan jeg lukke et avvik?<span class=\"plus\">+<\u002Fspan><\u002Fsummary>\n        <div class=\"ans\">Når tiltakene er fullført og verifisert som effektive i Fase 3. Er det knyttet en aksjon til avviket, må den være utført og verifisert først.<\u002Fdiv>\n      <\u002Fdetails>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ KONTAKT ============ -->\n<section class=\"block alt\" id=\"kontakt\">\n  <div class=\"wrap\">\n    <div class=\"contact\">\n      <div class=\"avatar\">BR<\u002Fdiv>\n      <div>\n        <h3>Bror Ramberg<\u002Fh3>\n        <div class=\"role\">Kontaktperson · spørsmål om avvikssystemet<\u002Fdiv>\n        <div class=\"rows\">\n          <a href=\"tel:98025401\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.5 2.1L8 9.6a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.8.3 1.7.5 2.6.6a2 2 0 0 1 1.7 2z\"><\u002Fpath><\u002Fsvg> 980 25 401<\u002Fa>\n          <a href=\"mailto:bror@ramberg.no\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"4\" width=\"20\" height=\"16\" rx=\"2\"><\u002Frect><path d=\"m2 7 10 6 10-6\"><\u002Fpath><\u002Fsvg> bror@ramberg.no<\u002Fa>\n          <span><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"><\u002Fpath><\u002Fsvg> Melding på infohub<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ FOOTER ============ -->\n<footer class=\"foot\">\n  <div class=\"wrap\">\n    <div class=\"brand\"><span class=\"dot\"><\u002Fspan> Avvikssystem · Antenor OTG<\u002Fdiv>\n    <div>Opplæringsmal — <span id=\"foot-mode\">Leder<\u002Fspan> · Ramberg · Enkel og effektiv avvikshåndtering<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script>\n  function setMode(mode) {\n    document.body.setAttribute('data-mode', mode);\n    document.querySelector('.role-switch .r-leder').setAttribute('aria-pressed', mode === 'leder');\n    document.querySelector('.role-switch .r-ansatt').setAttribute('aria-pressed', mode === 'ansatt');\n    const label = mode === 'leder' ? 'Leder (full versjon)' : 'Ansatt (forenklet versjon)';\n    document.getElementById('mode-label').textContent = label;\n    document.getElementById('mode-version').textContent = mode === 'leder' ? 'Leder' : 'Ansatt';\n    document.getElementById('foot-mode').textContent = mode === 'leder' ? 'Leder' : 'Ansatt';\n    try { localStorage.setItem('avvik-mode', mode); } catch (e) {}\n  }\n  (function () {\n    let saved = 'leder';\n    try { saved = localStorage.getItem('avvik-mode') || 'leder'; } catch (e) {}\n    setMode(saved);\n  })();\n\n  function toggleMenu() {\n    var n = document.getElementById('mobileNav');\n    var b = document.getElementById('menuToggle');\n    var open = n.classList.toggle('open');\n    b.setAttribute('aria-expanded', open ? 'true' : 'false');\n    b.setAttribute('aria-label', open ? 'Lukk meny' : 'Åpne meny');\n  }\n  function closeMenu() {\n    document.getElementById('mobileNav').classList.remove('open');\n    var b = document.getElementById('menuToggle');\n    b.setAttribute('aria-expanded', 'false');\n    b.setAttribute('aria-label', 'Åpne meny');\n  }\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
