document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rmal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"89e6eb01-5e44-44d0-8577-7b7c73ab5c3a\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"f250bdd1-6a7c-4d4a-af03-390709c4e21a\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"9a33fcbf-f152-46eb-a21d-e36e01230b67\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* =========================================================\n   Opplæring i nytt avvikssystem — Antenor OTG\n   Designsystem: blå/grønn, Hanken Grotesk + IBM Plex Mono\n   ========================================================= */\n\n:root {\n  /* Brand */\n  --blue:      #1f5fa8;\n  --blue-700:  #184c87;\n  --blue-2:    #3b82c4;\n  --green:     #1f8a5b;\n  --green-700: #176f49;\n\n  /* Phase accents */\n  --p1: #1f5fa8;\n  --p2: #3b82c4;\n  --p3: #1f8a5b;\n\n  /* Risk colors */\n  --risk-red:    #d64a4a;\n  --risk-orange: #e08a2e;\n  --risk-yellow: #e6c34a;\n  --risk-green:  #2faa6e;\n\n  /* Neutrals (cool slate) */\n  --ink:    #16202c;\n  --ink-2:  #3a4a5a;\n  --muted:  #6a7a8a;\n  --line:   #e2e8ef;\n  --line-2: #eef2f6;\n  --bg:     #f4f7fb;\n  --card:   #ffffff;\n  --tint:   #eef4fb;\n  --tint-g: #ecf6f0;\n\n  --radius: 16px;\n  --radius-sm: 10px;\n  --shadow-sm: 0 1px 2px rgba(20,40,70,.05), 0 1px 1px rgba(20,40,70,.04);\n  --shadow:    0 4px 16px rgba(20,45,80,.07), 0 1px 3px rgba(20,45,80,.05);\n  --shadow-lg: 0 18px 50px rgba(20,45,80,.13), 0 4px 12px rgba(20,45,80,.07);\n\n  --maxw: 1080px;\n  --font: \"Hanken Grotesk\", system-ui, sans-serif;\n  --mono: \"IBM Plex Mono\", ui-monospace, monospace;\n}\n\n* { box-sizing: border-box; }\n\nhtml { scroll-behavior: smooth; scroll-padding-top: 92px; }\n\nbody {\n  margin: 0;\n  font-family: var(--font);\n  color: var(--ink);\n  background: var(--bg);\n  font-size: 17px;\n  line-height: 1.6;\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4 { line-height: 1.15; margin: 0; font-weight: 700; letter-spacing: -.01em; }\np { margin: 0; text-wrap: pretty; }\na { color: var(--blue); }\n\n.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 28px; }\n\n/* ============ TOP BAR / ROLE SWITCH ============ */\n.topbar {\n  position: sticky; top: 0; z-index: 60;\n  background: rgba(255,255,255,.85);\n  backdrop-filter: saturate(180%) blur(14px);\n  -webkit-backdrop-filter: saturate(180%) blur(14px);\n  border-bottom: 1px solid var(--line);\n}\n.topbar-inner {\n  max-width: var(--maxw); margin: 0 auto; padding: 11px 28px;\n  display: flex; align-items: center; gap: 18px;\n}\n.tb-brand { display: flex; align-items: center; gap: 11px; font-weight: 700; letter-spacing: -.01em; }\n.tb-brand .dot {\n  width: 30px; height: 30px; border-radius: 9px; flex: none;\n  background: linear-gradient(135deg, var(--blue), var(--green));\n  display: grid; place-items: center; color: #fff;\n}\n.tb-brand small { display: block; font-weight: 500; font-size: 11.5px; color: var(--muted); letter-spacing: .02em; }\n.tb-title { font-size: 15px; line-height: 1.05; }\n\n.tb-spacer { flex: 1; }\n\n.tb-nav { display: flex; gap: 4px; }\n.tb-nav a {\n  font-size: 13.5px; font-weight: 600; color: var(--ink-2); text-decoration: none;\n  padding: 7px 11px; border-radius: 8px; white-space: nowrap;\n}\n.tb-nav a:hover { background: var(--tint); color: var(--blue); }\n\n/* ===== Mobile navigation (hamburger) ===== */\n.menu-toggle {\n  display: none; width: 44px; height: 44px; border-radius: 11px; border: 1px solid var(--line);\n  background: #fff; color: var(--ink); cursor: pointer; place-items: center; flex: none;\n}\n.menu-toggle svg { width: 23px; height: 23px; }\n.menu-toggle .x { display: none; }\n.menu-toggle[aria-expanded=\"true\"] .ham { display: none; }\n.menu-toggle[aria-expanded=\"true\"] .x { display: block; }\n\n.mobile-nav {\n  display: none; flex-direction: column; gap: 2px;\n  padding: 10px; border-top: 1px solid var(--line); background: #fff;\n  max-height: 72vh; overflow-y: auto; -webkit-overflow-scrolling: touch;\n}\n.mobile-nav.open { display: flex; }\n.mobile-nav a, .mobile-nav button {\n  font: inherit; text-align: left; text-decoration: none; color: var(--ink);\n  font-size: 16px; font-weight: 600; padding: 14px 14px; border-radius: 11px;\n  background: transparent; border: 0; cursor: pointer; display: flex; align-items: center; gap: 12px;\n  min-height: 50px;\n}\n.mobile-nav a .mn-ic, .mobile-nav button .mn-ic {\n  width: 30px; height: 30px; border-radius: 8px; background: var(--tint); color: var(--blue);\n  display: grid; place-items: center; flex: none;\n}\n.mobile-nav a .mn-ic svg, .mobile-nav button .mn-ic svg { width: 16px; height: 16px; }\n.mobile-nav a:active, .mobile-nav button:active { background: var(--tint); }\n.mobile-nav .mn-chev { margin-left: auto; color: var(--muted); width: 17px; height: 17px; flex: none; }\n.mobile-nav .mnav-divider { height: 1px; background: var(--line); margin: 9px 8px; }\n.mobile-nav .mnav-label { font-size: 11.5px; font-family: var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 6px 14px 2px; }\n.mobile-nav .mnav-action { color: var(--blue); }\n.mobile-nav .mnav-action .mn-ic { background: var(--blue); color: #fff; }\n\n/* Segmented role switch */\n.role-switch {\n  display: inline-flex; padding: 4px; gap: 3px;\n  background: #e9eef4; border-radius: 11px; border: 1px solid var(--line);\n}\n.role-switch button {\n  font: inherit; font-size: 13.5px; font-weight: 700;\n  border: 0; cursor: pointer; background: transparent; color: var(--ink-2);\n  padding: 7px 15px; border-radius: 8px; display: flex; align-items: center; gap: 7px;\n  transition: background .18s, color .18s, box-shadow .18s;\n}\n.role-switch button .ic { width: 16px; height: 16px; }\n.role-switch button[aria-pressed=\"true\"] { background: #fff; color: var(--blue); box-shadow: var(--shadow-sm); }\nbody[data-mode=\"ansatt\"] .role-switch button.r-ansatt[aria-pressed=\"true\"] { color: var(--green); }\n\n/* ============ MODE VISIBILITY ============ */\n.leder-only { display: revert; }\n.ansatt-only { display: none; }\nbody[data-mode=\"ansatt\"] .leder-only { display: none !important; }\nbody[data-mode=\"ansatt\"] .ansatt-only { display: revert; }\n\n/* ============ COVER ============ */\n.cover {\n  position: relative; overflow: hidden;\n  background:\n    radial-gradient(1100px 460px at 82% -8%, rgba(31,138,91,.16), transparent 60%),\n    radial-gradient(900px 520px at 8% 4%, rgba(31,95,168,.18), transparent 62%),\n    linear-gradient(160deg, #14375f 0%, #1f5fa8 52%, #1f8a5b 130%);\n  color: #fff;\n}\n.cover::after {\n  content: \"\"; position: absolute; inset: 0; pointer-events: none;\n  background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),\n                    linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);\n  background-size: 38px 38px; mask-image: radial-gradient(900px 500px at 70% 30%, #000, transparent 75%);\n}\n.cover-inner { position: relative; z-index: 1; max-width: var(--maxw); margin: 0 auto; padding: 54px 28px 60px; }\n\n.logo-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }\n.wordmark {\n  font-size: clamp(20px, 2.6vw, 26px); font-weight: 800; letter-spacing: -.015em; color: #fff;\n}\n.wordmark-x { color: rgba(255,255,255,.55); font-weight: 500; margin: 0 4px; }\n.logo-slot {\n  height: 50px; min-width: 150px; padding: 0 18px;\n  border: 1.5px dashed rgba(255,255,255,.45); border-radius: 10px;\n  display: flex; align-items: center; gap: 10px; color: rgba(255,255,255,.92);\n  font-family: var(--mono); font-size: 11.5px; letter-spacing: .02em;\n  background: rgba(255,255,255,.06);\n}\n.logo-slot strong { font-family: var(--font); font-size: 15px; letter-spacing: -.01em; }\n.logo-x { color: rgba(255,255,255,.5); font-size: 13px; }\n\n.cover-badge {\n  display: inline-flex; align-items: center; gap: 9px; margin-top: 40px;\n  background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.28);\n  padding: 7px 15px; border-radius: 999px; font-weight: 700; font-size: 13.5px;\n  backdrop-filter: blur(4px);\n}\n.cover-badge .pip { width: 9px; height: 9px; border-radius: 50%; background: #7ee0aa; box-shadow: 0 0 0 4px rgba(126,224,170,.25); }\n\n.cover h1 { font-size: clamp(34px, 6vw, 62px); margin-top: 18px; letter-spacing: -.025em; max-width: 16ch; }\n.cover .sub { font-size: clamp(18px, 2.4vw, 24px); margin-top: 16px; color: rgba(255,255,255,.92); font-weight: 500; max-width: 34ch; }\n\n.cover-meta { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 34px; }\n.cover-meta .chip {\n  background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22);\n  border-radius: 12px; padding: 12px 16px; min-width: 150px;\n}\n.cover-meta .chip .k { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.7); }\n.cover-meta .chip .v { font-weight: 700; font-size: 16px; margin-top: 3px; }\n\n/* ============ SECTIONS ============ */\nsection.block { padding: 64px 0; }\nsection.block.alt { background: #fff; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }\n\n.kicker {\n  display: inline-flex; align-items: center; gap: 9px;\n  font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase;\n  color: var(--blue); font-weight: 600; margin-bottom: 14px;\n}\n.kicker .n {\n  width: 26px; height: 26px; border-radius: 7px; background: var(--tint);\n  display: grid; place-items: center; color: var(--blue); font-family: var(--font); font-weight: 800; font-size: 14px;\n}\n.h2 { font-size: clamp(26px, 3.6vw, 38px); letter-spacing: -.02em; }\n.lead { font-size: 19px; color: var(--ink-2); margin-top: 14px; max-width: 60ch; }\n.section-head { margin-bottom: 36px; }\n\n/* ============ CARDS ============ */\n.card {\n  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);\n  box-shadow: var(--shadow-sm); padding: 26px;\n}\n.grid { display: grid; gap: 18px; }\n.g2 { grid-template-columns: repeat(2, 1fr); }\n.g3 { grid-template-columns: repeat(3, 1fr); }\n.g4 { grid-template-columns: repeat(4, 1fr); }\n\n.icon-badge {\n  width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center;\n  background: var(--tint); color: var(--blue); flex: none;\n}\n.icon-badge.green { background: var(--tint-g); color: var(--green); }\n.icon-badge svg { width: 24px; height: 24px; }\n\n/* Definition feature card */\n.def {\n  display: grid; grid-template-columns: 1.25fr 1fr; gap: 30px; align-items: stretch;\n}\n.def .big {\n  background: linear-gradient(160deg, #fff, var(--tint));\n  border: 1px solid var(--line); border-radius: var(--radius); padding: 30px;\n}\n.def .big .quote { font-size: clamp(20px, 2.6vw, 27px); font-weight: 700; letter-spacing: -.01em; line-height: 1.3; }\n.def .big .quote .hl { color: var(--blue); }\n.examples { display: grid; gap: 12px; align-content: start; }\n.ex {\n  display: flex; gap: 13px; align-items: flex-start; padding: 15px 16px;\n  background: #fff; border: 1px solid var(--line); border-radius: 12px;\n}\n.ex .icon-badge { width: 38px; height: 38px; border-radius: 10px; }\n.ex .icon-badge svg { width: 20px; height: 20px; }\n.ex b { display: block; font-size: 15.5px; }\n.ex span { font-size: 13.5px; color: var(--muted); }\n\n/* ============ PHASE FLOW (chevrons) ============ */\n.flow { display: flex; gap: 0; align-items: stretch; flex-wrap: wrap; }\n.chev {\n  --c: var(--blue);\n  position: relative; flex: 1 1 0; min-width: 250px;\n  background: #fff; border: 1px solid var(--line); border-left: 5px solid var(--c);\n  padding: 24px 26px 24px 24px; margin-right: 16px; margin-bottom: 16px;\n  border-radius: 12px; box-shadow: var(--shadow-sm);\n}\n.flow.chevmode .chev {\n  clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 50%, calc(100% - 22px) 100%, 0 100%, 22px 50%);\n  padding-left: 40px; margin-right: -10px; border: 0; border-radius: 0;\n  box-shadow: none;\n}\n.flow.chevmode .chev:first-child { clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 50%, calc(100% - 22px) 100%, 0 100%); padding-left: 26px; }\n.chev .ph-num {\n  font-family: var(--mono); font-size: 12px; letter-spacing: .1em; font-weight: 600;\n  color: var(--c); text-transform: uppercase; display: flex; align-items: center; gap: 8px;\n}\n.chev .ph-num .ic { width: 30px; height: 30px; border-radius: 8px; background: color-mix(in srgb, var(--c) 12%, #fff); display: grid; place-items: center; }\n.chev .ph-num .ic svg { width: 17px; height: 17px; color: var(--c); }\n.chev h3 { font-size: 19px; margin: 14px 0 7px; letter-spacing: -.01em; }\n.chev p { font-size: 14px; color: var(--ink-2); }\n.chev .who {\n  display: inline-flex; align-items: center; gap: 6px; margin-top: 14px;\n  font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px;\n}\n.who.ansatt { background: var(--tint-g); color: var(--green-700); }\n.who.leder { background: var(--tint); color: var(--blue-700); }\n\n/* responsibility legend */\n.legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 26px; align-items: center; }\n.legend .item { display: flex; align-items: center; gap: 9px; font-size: 14px; color: var(--ink-2); font-weight: 600; }\n.legend .sw { width: 26px; height: 14px; border-radius: 4px; }\n\n/* ============ DETAIL / PHASE PANELS ============ */\n.phase-panel { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); background: #fff; }\n.phase-panel + .phase-panel { margin-top: 26px; }\n.pp-head {\n  --c: var(--blue);\n  display: flex; align-items: center; gap: 16px; padding: 20px 24px;\n  background: linear-gradient(100deg, color-mix(in srgb, var(--c) 13%, #fff), #fff);\n  border-bottom: 1px solid var(--line); border-left: 6px solid var(--c);\n}\n.pp-head .pnum {\n  width: 44px; height: 44px; flex: none; border-radius: 11px; background: var(--c); color: #fff;\n  display: grid; place-items: center; font-weight: 800; font-size: 20px;\n}\n.pp-head .t .ttl { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }\n.pp-head .t .st { font-size: 13.5px; color: var(--muted); font-family: var(--mono); letter-spacing: .02em; }\n.pp-body { padding: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }\n.pp-body.single { grid-template-columns: 1fr; }\n\n.fields { display: grid; gap: 14px; align-content: start; }\n.field { display: flex; gap: 13px; align-items: flex-start; }\n.field .marker { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--blue)); margin-top: 7px; flex: none; }\n.field .fl { font-weight: 700; font-size: 15px; }\n.field .fd { font-size: 13.5px; color: var(--muted); }\n\n/* Screenshot frame */\n.shot { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); background: #fff; }\n.shot .bar {\n  display: flex; align-items: center; gap: 7px; padding: 9px 13px; background: #f1f4f8; border-bottom: 1px solid var(--line);\n}\n.shot .bar .d { width: 10px; height: 10px; border-radius: 50%; background: #cdd6e0; }\n.shot .bar .lbl { margin-left: 8px; font-family: var(--mono); font-size: 11px; color: var(--muted); }\n.shot img { display: block; width: 100%; height: auto; }\n.shot .cap { padding: 10px 14px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line-2); font-family: var(--mono); }\n\n.callout {\n  display: flex; gap: 14px; padding: 16px 18px; border-radius: 12px; margin-top: 4px;\n  background: var(--tint); border: 1px solid color-mix(in srgb, var(--blue) 18%, var(--line));\n}\n.callout .icon-badge { width: 38px; height: 38px; }\n.callout.green { background: var(--tint-g); border-color: color-mix(in srgb, var(--green) 18%, var(--line)); }\n.callout .ct b { font-size: 15px; }\n.callout .ct p { font-size: 14px; color: var(--ink-2); margin-top: 3px; }\n\n/* Two action buttons explainer */\n.btn-explain { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }\n.btn-card { display: flex; gap: 13px; align-items: flex-start; padding: 16px; border-radius: 12px; border: 1px solid var(--line); background: #fff; }\n.btn-card .sysbtn { width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; color: #fff; flex: none; }\n.btn-card .sysbtn svg { width: 22px; height: 22px; }\n.btn-card b { font-size: 15px; }\n.btn-card p { font-size: 13.5px; color: var(--muted); margin-top: 2px; }\n\n/* Risk rule chips */\n.risk-rules { display: grid; gap: 10px; margin-top: 6px; }\n.rrule { display: flex; align-items: center; gap: 13px; padding: 12px 15px; border-radius: 11px; border: 1px solid var(--line); background: #fff; }\n.rrule .sw { width: 18px; height: 18px; border-radius: 6px; flex: none; }\n.rrule .txt { font-size: 14px; }\n.rrule .txt b { font-weight: 700; }\n\n/* ============ AVVIK vs AKSJON diagram ============ */\n.link-diagram { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0; align-items: center; }\n.node {\n  border-radius: var(--radius); padding: 24px; border: 1px solid var(--line); background: #fff; box-shadow: var(--shadow);\n}\n.node.avvik { border-top: 5px solid var(--blue); }\n.node.aksjon { border-top: 5px solid var(--green); }\n.node .nh { display: flex; align-items: center; gap: 12px; }\n.node .nh .icon-badge { width: 42px; height: 42px; }\n.node .nh .t b { font-size: 18px; }\n.node .nh .t span { font-size: 12.5px; color: var(--muted); font-family: var(--mono); }\n.node ul { margin: 16px 0 0; padding: 0; list-style: none; display: grid; gap: 9px; }\n.node ul li { display: flex; gap: 10px; font-size: 14px; color: var(--ink-2); }\n.node ul li svg { width: 17px; height: 17px; color: var(--green); flex: none; margin-top: 3px; }\n\n.link-mid { display: grid; place-items: center; padding: 0 6px; }\n.link-mid .ring {\n  width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center;\n  background: #fff; border: 2px dashed var(--blue-2); color: var(--blue);\n}\n.link-mid .ring svg { width: 26px; height: 26px; }\n.link-mid .lbl { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-top: 8px; text-align: center; max-width: 90px; line-height: 1.3; }\n\n.lock-note {\n  margin-top: 22px; display: flex; gap: 15px; align-items: center;\n  background: linear-gradient(100deg, #fff6ec, #fff); border: 1px solid #f0d9b8; border-radius: 14px; padding: 18px 20px;\n}\n.lock-note .icon-badge { width: 48px; height: 48px; background: #fbe9cf; color: #b9791e; }\n.lock-note b { color: #8a5a14; font-size: 16px; }\n.lock-note p { font-size: 14.5px; color: var(--ink-2); margin-top: 3px; }\n\n/* ============ TIPS ============ */\n.tip { padding: 22px; border-radius: 14px; border: 1px solid var(--line); background: #fff; box-shadow: var(--shadow-sm); }\n.tip .icon-badge { margin-bottom: 14px; }\n.tip h4 { font-size: 16.5px; margin-bottom: 6px; }\n.tip p { font-size: 14px; color: var(--ink-2); }\n\n/* ============ TIMELINE (etter sending) ============ */\n.timeline { position: relative; margin-top: 8px; padding-left: 8px; }\n.tstep { position: relative; display: grid; grid-template-columns: 52px 1fr; gap: 18px; padding-bottom: 26px; }\n.tstep:last-child { padding-bottom: 0; }\n.tstep .num {\n  width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; z-index: 1;\n  font-weight: 800; font-size: 18px; color: #fff; background: var(--blue);\n}\n.tstep:nth-child(2) .num { background: var(--blue-2); }\n.tstep:nth-child(3) .num { background: color-mix(in srgb, var(--blue-2) 60%, var(--green)); }\n.tstep:nth-child(4) .num { background: var(--green); }\n.tstep::before {\n  content: \"\"; position: absolute; left: 21px; top: 44px; bottom: -6px; width: 2px; background: var(--line);\n}\n.tstep:last-child::before { display: none; }\n.tstep .body { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow-sm); }\n.tstep .body h4 { font-size: 16px; }\n.tstep .body p { font-size: 14px; color: var(--ink-2); margin-top: 4px; }\n\n/* ============ FAQ ============ */\n.faq { display: grid; gap: 12px; }\ndetails.qa {\n  background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 4px 6px;\n  box-shadow: var(--shadow-sm); overflow: hidden;\n}\ndetails.qa summary {\n  list-style: none; cursor: pointer; padding: 16px 18px; font-weight: 700; font-size: 16.5px;\n  display: flex; align-items: center; gap: 13px; color: var(--ink);\n}\ndetails.qa summary::-webkit-details-marker { display: none; }\ndetails.qa summary .plus {\n  margin-left: auto; width: 26px; height: 26px; border-radius: 7px; background: var(--tint); color: var(--blue);\n  display: grid; place-items: center; font-size: 19px; transition: transform .22s; flex: none;\n}\ndetails.qa[open] summary .plus { transform: rotate(45deg); }\ndetails.qa .ans { padding: 0 18px 18px 57px; font-size: 14.5px; color: var(--ink-2); }\ndetails.qa summary .qn { width: 30px; height: 30px; border-radius: 8px; background: var(--tint); color: var(--blue); display: grid; place-items: center; font-family: var(--mono); font-size: 13px; font-weight: 700; flex: none; }\n\n/* ============ CONTACT ============ */\n.contact {\n  display: grid; grid-template-columns: auto 1fr; gap: 26px; align-items: center;\n  background: linear-gradient(150deg, #14375f, #1f5fa8 70%, #1f8a5b 150%); color: #fff;\n  border-radius: var(--radius); padding: 32px; box-shadow: var(--shadow-lg);\n}\n.contact .avatar {\n  width: 84px; height: 84px; border-radius: 20px; background: rgba(255,255,255,.16);\n  border: 1.5px solid rgba(255,255,255,.3); display: grid; place-items: center; font-size: 30px; font-weight: 800;\n}\n.contact h3 { font-size: 22px; }\n.contact .role { font-size: 14px; color: rgba(255,255,255,.85); font-family: var(--mono); margin-top: 2px; }\n.contact .rows { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }\n.contact .rows a, .contact .rows span {\n  display: inline-flex; align-items: center; gap: 9px; text-decoration: none; color: #fff;\n  background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.22);\n  padding: 9px 15px; border-radius: 10px; font-weight: 600; font-size: 14.5px;\n}\n.contact .rows svg { width: 17px; height: 17px; }\n\n/* ============ INFO PILL ============ */\n.mode-note {\n  display: flex; gap: 14px; align-items: flex-start; padding: 18px 20px; border-radius: 14px;\n  background: var(--tint-g); border: 1px solid color-mix(in srgb, var(--green) 22%, var(--line)); margin-top: 22px;\n}\n.mode-note .icon-badge { background: #fff; }\n.mode-note b { font-size: 16px; }\n.mode-note p { font-size: 14.5px; color: var(--ink-2); margin-top: 3px; }\n\n/* ============ FOOTER ============ */\nfooter.foot { background: #11202f; color: rgba(255,255,255,.72); padding: 38px 0; font-size: 14px; }\nfooter.foot .wrap { display: flex; justify-content: space-between; gap: 18px; flex-wrap: wrap; align-items: center; }\nfooter.foot .brand { display: flex; align-items: center; gap: 11px; color: #fff; font-weight: 700; }\nfooter.foot .brand .dot { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--blue), var(--green)); }\nfooter.foot a { color: #9fc3ea; }\n\n/* print button */\n.print-btn {\n  display: inline-flex; align-items: center; gap: 8px; font: inherit; font-weight: 700; font-size: 13px;\n  cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--ink-2);\n  padding: 8px 13px; border-radius: 9px;\n}\n.print-btn:hover { border-color: var(--blue); color: var(--blue); }\n.print-btn svg { width: 16px; height: 16px; }\n\n/* ============ RESPONSIVE ============ */\n.topbar-inner { min-width: 0; }\n/* Skjul desktop-navigasjon + verktøyknapper før de presser siden bredere enn\n   skjermen, og vis hamburger-menyen i stedet (gjelder begge håndbøkene). */\n@media (max-width: 1120px) {\n  .tb-nav, .tb-title { display: none; }\n  .tb-desktop { display: none !important; }\n  .menu-toggle { display: grid; }\n}\n@media (max-width: 880px) {\n  body { font-size: 16px; }\n  .g2, .g3, .g4, .def, .pp-body, .link-diagram, .contact, .btn-explain { grid-template-columns: 1fr; }\n  .link-mid { padding: 14px 0; }\n  .link-mid .ring { transform: rotate(90deg); }\n  .role-switch button { min-height: 42px; }\n  .flow.chevmode .chev { clip-path: none !important; padding-left: 24px; margin-right: 0; border-radius: 12px; border: 1px solid var(--line); border-left: 5px solid var(--c); box-shadow: var(--shadow-sm); }\n}\n@media (max-width: 560px) {\n  .cover-inner { padding: 38px 22px 44px; }\n  .wrap, .topbar-inner { padding-left: 18px; padding-right: 18px; }\n  .topbar-inner { gap: 12px; }\n  .role-switch { padding: 3px; }\n  .role-switch button { padding: 8px 12px; min-height: 42px; }\n  section.block { padding: 44px 0; }\n  .lead { font-size: 16.5px; }\n  .cover .sub { font-size: 17px; }\n  .section-head { margin-bottom: 26px; }\n  .cover-meta .chip { flex: 1 1 calc(50% - 7px); min-width: 0; }\n  .card { padding: 20px; }\n}\n\n/* ============ PRINT ============ */\n@media print {\n  :root { --shadow: none; --shadow-sm: none; --shadow-lg: none; }\n  body { background: #fff; font-size: 11pt; }\n  .topbar, .tb-nav, .print-btn, .role-switch { position: static; }\n  .topbar { box-shadow: none; }\n  section.block { padding: 22px 0; break-inside: avoid-page; }\n  .cover { -webkit-print-color-adjust: exact; print-color-adjust: exact; }\n  .phase-panel, .card, .chev, .tip, .node, .contact, details.qa { break-inside: avoid; }\n  .no-print { display: none !important; }\n}\n<\u002Fstyle>\n<style>/* =========================================================\n   Systemoversikt — Slik fungerer kvalitetssystemet (ABMS)\n   Antenor OTG · bygger på styles.css (samme tokens)\n   ========================================================= */\n\n:root {\n  /* System menu colors (matchet mot skjermbildene) */\n  --sys-blue:       #1f7be0;\n  --sys-blue-2:     #2f8ae8;\n  --sys-yellow:     #efb023;\n  --sys-slate:      #6e7e9d;\n  --sys-slate-dk:   #4f5f86;\n  --sys-red:        #b5294a;\n  --sys-red-2:      #c93158;\n  --sys-teal:       #4e9cb8;\n  --sys-green:      #3a9d52;\n}\n\n/* ============ STAGE FLOW (big picture lukket sløyfe) ============ */\n.loop-intro { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; align-items: stretch; }\n.loop-stage {\n  position: relative; background: #fff; border: 1px solid var(--line); border-radius: 14px;\n  padding: 24px 22px; box-shadow: var(--shadow-sm); margin-right: 30px; z-index: 1;\n}\n.loop-stage:last-child { margin-right: 0; }\n.loop-stage::after {\n  content: \"\"; position: absolute; right: -30px; top: 50%; width: 30px; height: 2px; background: var(--line); z-index: 0;\n}\n.loop-stage:last-child::after { display: none; }\n.loop-stage .arrow {\n  position: absolute; right: -16px; top: 50%; transform: translateY(-50%); z-index: 2;\n  width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 2px solid var(--line);\n  display: grid; place-items: center; color: var(--muted);\n}\n.loop-stage:last-child .arrow { display: none; }\n.loop-stage .arrow svg { width: 14px; height: 14px; }\n.loop-stage .badge {\n  width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: #fff; margin-bottom: 14px;\n}\n.loop-stage .badge svg { width: 23px; height: 23px; }\n.loop-stage .st-n { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }\n.loop-stage h3 { font-size: 18px; margin: 3px 0 8px; letter-spacing: -.01em; }\n.loop-stage p { font-size: 13.5px; color: var(--ink-2); }\n.loop-stage.s1 .badge { background: var(--sys-blue); }\n.loop-stage.s2 .badge { background: var(--sys-red); }\n.loop-stage.s3 .badge { background: var(--sys-teal); }\n.loop-stage.s4 .badge { background: var(--sys-green); }\n\n.loop-return {\n  display: flex; align-items: center; gap: 12px; justify-content: center;\n  margin-top: 22px; padding: 14px 20px; border-radius: 999px;\n  background: var(--tint); border: 1px dashed color-mix(in srgb, var(--blue) 35%, var(--line));\n  font-weight: 700; font-size: 14.5px; color: var(--blue-700);\n}\n.loop-return svg { width: 19px; height: 19px; }\n\n/* ============ MENU MAP (Hovedmeny gjenskapt) ============ */\n.menu-map { display: grid; gap: 26px; }\n.mgroup { }\n.mgroup-h {\n  display: flex; align-items: center; gap: 12px; margin-bottom: 13px;\n}\n.mgroup-h .lbl { font-weight: 800; font-size: 15px; letter-spacing: -.01em; color: var(--ink); }\n.mgroup-h .sw { width: 12px; height: 12px; border-radius: 4px; flex: none; }\n.mgroup-h .desc { font-size: 13px; color: var(--muted); margin-left: auto; text-align: right; max-width: 46ch; }\n.mrow { display: flex; flex-wrap: wrap; gap: 10px; }\n.mbox {\n  flex: 1 1 auto; min-width: 130px; text-align: center; padding: 14px 14px; border-radius: 8px;\n  color: #fff; font-weight: 600; font-size: 13.5px; line-height: 1.25; box-shadow: var(--shadow-sm);\n  display: flex; align-items: center; justify-content: center; min-height: 50px;\n}\n.mbox.blue   { background: var(--sys-blue); }\n.mbox.yellow { background: var(--sys-yellow); color: #5a4406; }\n.mbox.slate  { background: var(--sys-slate); }\n.mbox.slate-dk { background: var(--sys-slate-dk); box-shadow: 0 0 0 2px color-mix(in srgb, var(--sys-slate-dk) 35%, #fff); }\n.mbox.teal   { background: var(--sys-teal); }\n\n/* highlight pill on a mapped box that links to other page */\n.mbox.link { position: relative; cursor: pointer; text-decoration: none; transition: transform .14s, box-shadow .14s; }\n.mbox.link:hover { transform: translateY(-2px); box-shadow: var(--shadow); }\n.mbox.link .gomark {\n  position: absolute; top: 6px; right: 7px; width: 16px; height: 16px; border-radius: 50%;\n  background: rgba(255,255,255,.25); display: grid; place-items: center;\n}\n.mbox.link .gomark svg { width: 10px; height: 10px; }\n\n/* value chain inline (Transport → Logistikk red) */\n.mchain { display: flex; gap: 0; flex-wrap: wrap; }\n.mchain .vstep { min-width: 170px; max-width: 240px; }\n\n/* ============ VALUE CHAIN CHEVRONS ============ */\n.vchain {\n  display: flex; gap: 0; align-items: stretch; flex-wrap: wrap; row-gap: 10px;\n}\n.vstep {\n  --c: var(--sys-blue);\n  position: relative; flex: 1 1 0; min-width: 150px;\n  background: var(--c); color: #fff; padding: 16px 18px 16px 26px; margin-right: -8px;\n  display: flex; flex-direction: column; justify-content: center; min-height: 60px;\n  clip-path: polygon(0 0, calc(100% - 17px) 0, 100% 50%, calc(100% - 17px) 100%, 0 100%, 17px 50%);\n}\n.vstep:first-child { clip-path: polygon(0 0, calc(100% - 17px) 0, 100% 50%, calc(100% - 17px) 100%, 0 100%); padding-left: 18px; }\n.vstep .vn { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; opacity: .82; }\n.vstep .vt { font-weight: 700; font-size: 14px; line-height: 1.2; margin-top: 2px; }\n.vstep.red   { --c: var(--sys-red); }\n.vstep.red2  { --c: var(--sys-red-2); }\n.vstep.blue  { --c: var(--sys-blue); }\n.vstep.green { --c: var(--sys-green); }\n\n.vchain-legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 16px; }\n.vchain-legend .item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); font-weight: 600; }\n.vchain-legend .sw { width: 22px; height: 12px; border-radius: 3px; }\n\n/* department doc chips under a value chain */\n.dept-docs { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 18px; }\n.dept-chip {\n  font-size: 12.5px; font-weight: 600; color: #fff; background: var(--sys-teal);\n  padding: 8px 13px; border-radius: 7px;\n}\n.dept-chip.hand { background: var(--sys-green); }\n\n/* stage explanation cards under value chain */\n.stage-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 12px; margin-top: 20px; }\n.stage-card { border: 1px solid var(--line); border-radius: 11px; padding: 14px 15px; background: #fff; box-shadow: var(--shadow-sm); border-top: 4px solid var(--c, var(--sys-blue)); }\n.stage-card .sc-n { font-family: var(--mono); font-size: 11px; color: var(--muted); }\n.stage-card b { display: block; font-size: 14px; margin: 3px 0 4px; }\n.stage-card p { font-size: 12.5px; color: var(--muted); }\n\n/* ============ PDCA ============ */\n.pdca { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }\n.pcard { border-radius: 14px; padding: 20px; color: #fff; position: relative; overflow: hidden; box-shadow: var(--shadow); }\n.pcard .pl { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; opacity: .85; }\n.pcard h4 { font-size: 18px; margin: 4px 0 9px; }\n.pcard ul { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 6px; }\n.pcard ul li { font-size: 13px; display: flex; gap: 8px; align-items: flex-start; opacity: .96; }\n.pcard ul li::before { content: \"\"; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-top: 7px; flex: none; opacity: .8; }\n.pcard.p1 { background: linear-gradient(155deg, #2f8ae8, #1f5fa8); }\n.pcard.p2 { background: linear-gradient(155deg, #5a6c92, #4f5f86); }\n.pcard.p3 { background: linear-gradient(155deg, #3a9d52, #1f8a5b); }\n.pcard.p4 { background: linear-gradient(155deg, #e0992a, #c47a1a); }\n.pcard .big-letter { position: absolute; right: 10px; bottom: -14px; font-size: 84px; font-weight: 800; opacity: .14; line-height: 1; }\n\n/* ============ DASHBOARD MOCKUP ============ */\n.dash {\n  background: #eef2f7; border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow);\n  min-width: 0;\n}\n.dash-search {\n  display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line);\n  border-radius: 9px; padding: 10px 14px; color: var(--muted); font-size: 14px; margin-bottom: 14px;\n}\n.dash-search svg { width: 17px; height: 17px; }\n.dash-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }\n.stat-card { background: #fff; border: 1px solid var(--line); border-radius: 11px; padding: 16px; box-shadow: var(--shadow-sm); }\n.stat-card .sk { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); line-height: 1.3; min-height: 28px; }\n.stat-card .sv { font-size: 38px; font-weight: 800; line-height: 1; margin: 8px 0 10px; }\n.stat-card .sf { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--muted); }\n.stat-card .sf .pill { min-width: 20px; height: 18px; padding: 0 5px; border-radius: 5px; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 11px; }\n.stat-card.red   .sv { color: var(--risk-red); } .stat-card.red .pill { background: var(--risk-red); }\n.stat-card.amber .sv { color: var(--sys-yellow); } .stat-card.amber .pill { background: var(--sys-yellow); color:#5a4406; }\n.stat-card.orange .sv { color: #e0871f; } .stat-card.orange .pill { background: #e0871f; }\n.stat-card.green .sv { color: var(--sys-green); } .stat-card.green .pill { background: var(--sys-green); }\n\n.dash-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; }\n.panel { background: #fff; border: 1px solid var(--line); border-radius: 11px; padding: 16px; box-shadow: var(--shadow-sm); }\n.panel h5 { font-size: 14px; margin-bottom: 14px; color: var(--ink); }\n\n/* bar chart */\n.bars { display: flex; align-items: flex-end; gap: 7px; height: 170px; padding-top: 10px; border-bottom: 1px solid var(--line); }\n.bar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 5px; }\n.bar .col { width: 70%; background: #5a9bd4; border-radius: 3px 3px 0 0; min-height: 2px; }\n.bar .bv { font-size: 10.5px; color: var(--muted); font-weight: 700; }\n.bar.hi .col { background: var(--sys-blue); }\n.bar-labels { display: flex; gap: 7px; margin-top: 7px; }\n.bar-labels span { flex: 1; font-size: 9px; color: var(--muted); text-align: center; line-height: 1.15; transform: rotate(0deg); }\n\n/* activity table */\n.acts { display: grid; gap: 0; }\n.act-row { display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-bottom: 1px solid var(--line-2); }\n.act-row:last-child { border-bottom: 0; }\n.act-row .at { font-size: 13px; color: var(--ink-2); flex: 1; }\n.act-row .am { font-size: 11px; font-weight: 700; color: var(--sys-slate-dk); background: var(--tint); padding: 3px 9px; border-radius: 6px; flex: none; }\n\n/* fav docs */\n.fav-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 4px; border-bottom: 1px solid var(--line-2); }\n.fav-row:last-child { border-bottom: 0; }\n.fav-row .ft { font-size: 13px; color: var(--ink-2); }\n.fav-row .fm { font-size: 11px; color: var(--muted); font-family: var(--mono); }\n\n/* profile menu mock */\n.profile-mock {\n  width: 250px; background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow);\n}\n.profile-mock .pm-head { display: flex; align-items: center; gap: 11px; padding: 14px; border-bottom: 1px solid var(--line); }\n.profile-mock .pm-head .pa { width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(135deg,var(--blue),var(--green)); color:#fff; display:grid; place-items:center; font-weight:800; }\n.profile-mock .pm-head .pn { font-weight: 700; font-size: 14px; }\n.profile-mock .pm-head .pe { font-size: 11.5px; color: var(--muted); }\n.profile-mock .pm-item { display: flex; align-items: center; gap: 11px; padding: 11px 14px; font-size: 13.5px; color: var(--ink-2); font-weight: 600; }\n.profile-mock .pm-item svg { width: 16px; height: 16px; color: var(--blue); }\n.profile-mock .pm-item + .pm-item { border-top: 1px solid var(--line-2); }\n.profile-mock .pm-cust { padding: 9px 14px; font-size: 11px; color: var(--muted); background: var(--bg); font-family: var(--mono); letter-spacing:.04em; text-transform:uppercase; }\n\n.dash-explain { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 26px; align-items: start; }\n\n/* ============ PROSESSEIER / DOKUMENTER ============ */\n.docs-split { display: grid; grid-template-columns: 1fr 1.18fr; gap: 30px; align-items: start; }\n.docs-split .examples { gap: 13px; }\n.docs-split .shot { position: sticky; top: 92px; }\n\n/* ============ CONNECT SUMMARY ============ */\n.connect { display: grid; grid-template-columns: repeat(4,1fr); gap: 0; align-items: center; margin-top: 8px; }\n.connect .cnode {\n  text-align: center; padding: 16px 12px; border-radius: 12px; font-weight: 700; font-size: 14px; color: #fff;\n  position: relative; margin-right: 26px;\n}\n.connect .cnode:last-child { margin-right: 0; }\n.connect .cnode::after { content: \"→\"; position: absolute; right: -20px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 18px; font-weight: 700; }\n.connect .cnode:last-child::after { content: \"↻\"; right: -22px; color: var(--blue); }\n.connect .c1 { background: var(--sys-blue); } .connect .c2 { background: var(--sys-red); }\n.connect .c3 { background: var(--sys-teal); } .connect .c4 { background: var(--sys-green); }\n\n/* cross-page CTA card */\n.xpage {\n  display: flex; align-items: center; gap: 20px; padding: 24px 26px; border-radius: var(--radius);\n  background: linear-gradient(120deg, var(--tint), #fff); border: 1px solid var(--line); box-shadow: var(--shadow-sm);\n}\n.xpage .icon-badge { width: 54px; height: 54px; }\n.xpage .xt b { font-size: 17px; } .xpage .xt p { font-size: 14px; color: var(--ink-2); margin-top: 3px; }\n.xpage a.go {\n  margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 9px; text-decoration: none;\n  background: var(--blue); color: #fff; font-weight: 700; font-size: 14.5px; padding: 12px 20px; border-radius: 11px;\n}\n.xpage a.go svg { width: 17px; height: 17px; }\n\n/* ============ RESPONSIVE ============ */\n/* Mellomstore skjermer: bryt faste rutenett og rett ut chevron-flyten\n   før den «sprekker» (verdikjedene + dashbordet). */\n@media (max-width: 1024px) {\n  /* Verdikjede: gå fra clip-path-chevroner til jevnt rutenett (ingen ballong) */\n  .vchain { display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); gap: 8px; }\n  .vstep, .vstep:first-child {\n    clip-path: none !important; margin-right: 0 !important; border-radius: 9px;\n    padding-left: 16px !important; min-height: 54px;\n  }\n  .mchain { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n  /* Dashbord: stable kolonner som faktisk kan krympe */\n  .dash-explain { grid-template-columns: 1fr; }\n  .docs-split { grid-template-columns: 1fr; }\n  .docs-split .shot { position: static; }\n  .dash-grid { grid-template-columns: 1fr; }\n  .dash-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n  .profile-mock { width: 100%; max-width: 320px; }\n}\n@media (max-width: 900px) {\n  .loop-intro, .pdca, .connect { grid-template-columns: repeat(2, 1fr); }\n  .loop-stage { margin-right: 0; margin-bottom: 28px; }\n  .loop-stage::after, .loop-stage .arrow { display: none; }\n  .connect .cnode { margin-right: 0; margin-bottom: 22px; }\n  .connect .cnode::after { right: 50%; top: auto; bottom: -20px; transform: translateX(50%); content: \"↓\"; }\n  .connect .cnode:last-child::after { display:none; }\n  .mgroup-h .desc { display: none; }\n}\n@media (max-width: 560px) {\n  .loop-intro, .pdca, .connect { grid-template-columns: 1fr; }\n  .dash-stats { grid-template-columns: 1fr; }\n  .bar-labels span { font-size: 8px; }\n  /* CTA-kort stabler på mobil */\n  .xpage { flex-direction: column; align-items: flex-start; gap: 14px; padding: 20px; }\n  .xpage a.go { margin-left: 0; width: 100%; justify-content: center; }\n  /* Diagram får horisontal scroll så søylene forblir lesbare */\n  .panel.chart-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }\n  .chart-scroll .bars, .chart-scroll .bar-labels { min-width: 440px; }\n  .loop-stage, .pcard, .stat-card { padding: 18px; }\n  .connect .cnode { font-size: 15px; padding: 15px 12px; }\n  .dept-docs { gap: 8px; }\n}\n\n@media print {\n  .dash, .pcard, .stage-card, .loop-stage, .panel { break-inside: avoid; }\n}\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n\n<!-- ============ TOP BAR ============ -->\n<div class=\"topbar no-print\">\n  <div class=\"topbar-inner\">\n    <div class=\"tb-brand\">\n      <span class=\"dot\">\n        <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12h4l3 8 4-16 3 8h4\"><\u002Fpath><\u002Fsvg>\n      <\u002Fspan>\n      <div class=\"tb-title\">\n        Kvalitetssystemet\n        <small>Ramberg · ABMS<\u002Fsmall>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <nav class=\"tb-nav\">\n      <a href=\"#bilde\">Big picture<\u002Fa>\n      <a href=\"#meny\">Hovedmenyen<\u002Fa>\n      <a href=\"#forbedring\">Forbedring<\u002Fa>\n      <a href=\"#transport\">Transport<\u002Fa>\n      <a href=\"#logistikk\">Logistikk<\u002Fa>\n      <a href=\"#dokumenter\">Dokumenter<\u002Fa>\n
