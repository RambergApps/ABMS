2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m9 18 6-6-6-6\"><\u002Fpath><\u002Fsvg><\u002Fa>\n    <a href=\"#logistikk\" onclick=\"closeMenu()\"><span class=\"mn-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 8 12 3l9 5v8l-9 5-9-5z\"><\u002Fpath><path d=\"M3 8l9 5 9-5M12 13v8\"><\u002Fpath><\u002Fsvg><\u002Fspan> Verdikjede Logistikk <svg class=\"mn-chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m9 18 6-6-6-6\"><\u002Fpath><\u002Fsvg><\u002Fa>\n    <a href=\"#dokumenter\" onclick=\"closeMenu()\"><span class=\"mn-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"><\u002Fpath><path d=\"M14 2v6h6\"><\u002Fpath><\u002Fsvg><\u002Fspan> Prosesseier &amp; dokumenter <svg class=\"mn-chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m9 18 6-6-6-6\"><\u002Fpath><\u002Fsvg><\u002Fa>\n    <a href=\"#dashboard\" onclick=\"closeMenu()\"><span class=\"mn-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"><\u002Frect><path d=\"M3 9h18M9 21V9\"><\u002Fpath><\u002Fsvg><\u002Fspan> Min side <svg class=\"mn-chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m9 18 6-6-6-6\"><\u002Fpath><\u002Fsvg><\u002Fa>\n    <div class=\"mnav-divider\"><\u002Fdiv>\n    <a class=\"mnav-action\" href=\"avvikshandbok.html\"><span class=\"mn-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3l8 4v5c0 4.5-3.2 7.5-8 9-4.8-1.5-8-4.5-8-9V7z\"><\u002Fpath><path d=\"M9 12l2 2 4-4\"><\u002Fpath><\u002Fsvg><\u002Fspan> Åpne avvikshåndboken<\u002Fa>\n    <button class=\"mnav-action\" onclick=\"window.print()\"><span class=\"mn-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 9V3h12v6\"><\u002Fpath><path d=\"M6 18H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2\"><\u002Fpath><rect x=\"6\" y=\"14\" width=\"12\" height=\"7\" rx=\"1\"><\u002Frect><\u002Fsvg><\u002Fspan> Skriv ut / lagre som PDF<\u002Fbutton>\n  <\u002Fnav>\n<\u002Fdiv>\n\n<!-- ============ COVER ============ -->\n<header class=\"cover\">\n  <div class=\"cover-inner\">\n    <div class=\"logo-row\">\n      <div class=\"wordmark\">Antenor ABMS <span class=\"wordmark-x\">–<\u002Fspan> Ramberg<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"cover-badge\">\n      <span class=\"pip\"><\u002Fspan>\n      <span>Systemoversikt · for nye ansatte og ledere<\u002Fspan>\n    <\u002Fdiv>\n\n    <h1>Slik fungerer kvalitetssystemet<\u002Fh1>\n    <p class=\"sub\">Hele bedriften i ett system — fra strategi og verdikjeder til støtte og kontinuerlig forbedring. Du forstår helheten på 2–3 minutter.<\u002Fp>\n\n    <div class=\"cover-meta\">\n      <div class=\"chip\"><div class=\"k\">System<\u002Fdiv><div class=\"v\">ABMS<\u002Fdiv><\u002Fdiv>\n      <div class=\"chip\"><div class=\"k\">Bedrift<\u002Fdiv><div class=\"v\">Ramberg<\u002Fdiv><\u002Fdiv>\n      <div class=\"chip\"><div class=\"k\">Verdikjeder<\u002Fdiv><div class=\"v\">Transport · Logistikk<\u002Fdiv><\u002Fdiv>\n      <div class=\"chip\"><div class=\"k\">Prinsipp<\u002Fdiv><div class=\"v\">Lukket sløyfe<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ============ BIG PICTURE ============ -->\n<section class=\"block\" id=\"bilde\">\n  <div class=\"wrap\">\n    <div class=\"section-head\">\n      <span class=\"kicker\"><span class=\"n\">1<\u002Fspan> Big picture<\u002Fspan>\n      <h2 class=\"h2\">Alt henger sammen i én lukket sløyfe<\u002Fh2>\n      <p class=\"lead\">Kvalitetssystemet samler hele bedriften på ett sted. Tenk på det som et kretsløp i fire ledd: vi setter retning, skaper verdi for kunden, støtter driften — og lærer av alt vi gjør, slik at vi blir litt bedre hver runde.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"loop-intro\">\n      <div class=\"loop-stage s1\">\n        <span class=\"badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"0.6\" fill=\"currentColor\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n        <div class=\"st-n\">Ledd 1<\u002Fdiv>\n        <h3>Strategi &amp; mål<\u002Fh3>\n        <p>Vi setter retning: visjon, verdier, politikk og mål for hva vi vil oppnå.<\u002Fp>\n        <span class=\"arrow\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"m13 6 6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"loop-stage s2\">\n        <span class=\"badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7h11v8H3z\"><\u002Fpath><path d=\"M14 10h4l3 3v2h-7z\"><\u002Fpath><circle cx=\"7\" cy=\"18\" r=\"2\"><\u002Fcircle><circle cx=\"17\" cy=\"18\" r=\"2\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n        <div class=\"st-n\">Ledd 2<\u002Fdiv>\n        <h3>Verdikjedene<\u002Fh3>\n        <p>Vi skaper verdi: Transport og Logistikk — kjernen i det kundene betaler for.<\u002Fp>\n        <span class=\"arrow\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"m13 6 6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"loop-stage s3\">\n        <span class=\"badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"3.5\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n        <div class=\"st-n\">Ledd 3<\u002Fdiv>\n        <h3>Støtteprosesser<\u002Fh3>\n        <p>Vi støtter driften: HR, KHMS, økonomi, IT, salg — alt som holder hjulene i gang.<\u002Fp>\n        <span class=\"arrow\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"m13 6 6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"loop-stage s4\">\n        <span class=\"badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 12a9 9 0 1 1-3-6.7\"><\u002Fpath><path d=\"M21 4v5h-5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <div class=\"st-n\">Ledd 4<\u002Fdiv>\n        <h3>Kontinuerlig forbedring<\u002Fh3>\n        <p>Vi lærer: avvik, risiko, revisjoner og forslag gjør oss tryggere og bedre.<\u002Fp>\n        <span class=\"arrow\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"m13 6 6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"loop-return\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 12a9 9 0 1 1-3-6.7\"><\u002Fpath><path d=\"M21 4v5h-5\"><\u002Fpath><\u002Fsvg>\n      Forbedringene mater tilbake inn i strategien — og sløyfen starter på nytt, litt bedre hver gang.\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ HOVEDMENYEN ============ -->\n<section class=\"block alt\" id=\"meny\">\n  <div class=\"wrap\">\n    <div class=\"section-head\">\n      <span class=\"kicker\"><span class=\"n\">2<\u002Fspan> Kart over systemet<\u002Fspan>\n      <h2 class=\"h2\">Hovedmenyen — der alt starter<\u002Fh2>\n      <p class=\"lead\">Hovedmenyen er inngangen til hele bedriften. Den er bygget opp i fem grupper med fast fargekode, så du alltid vet hva slags innhold du ser på.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"menu-map\">\n      <!-- Strategi -->\n      <div class=\"mgroup\">\n        <div class=\"mgroup-h\"><span class=\"sw\" style=\"background:var(--sys-blue)\"><\u002Fspan><span class=\"lbl\">Strategi &amp; Mål<\u002Fspan><span class=\"desc\">Retningen vår — visjon, verdier, politikk og planer.<\u002Fspan><\u002Fdiv>\n        <div class=\"mrow\">\n          <div class=\"mbox blue\">Visjon og Misjon<\u002Fdiv>\n          <div class=\"mbox blue\">Etiske retningslinjer<\u002Fdiv>\n          <div class=\"mbox blue\">Personalhåndbok<\u002Fdiv>\n          <div class=\"mbox blue\">Organisasjonskart<\u002Fdiv>\n          <div class=\"mbox blue\">KHMS Manual / Politikk<\u002Fdiv>\n          <div class=\"mbox blue\">Handlingsplan · Årshjul<\u002Fdiv>\n          <div class=\"mbox yellow\">Analyser<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Forbedring -->\n      <div class=\"mgroup\">\n        <div class=\"mgroup-h\"><span class=\"sw\" style=\"background:var(--sys-slate)\"><\u002Fspan><span class=\"lbl\">Kontinuerlig Forbedring<\u002Fspan><span class=\"desc\">Sløyfen som gjør oss bedre — meld, mål og lukk.<\u002Fspan><\u002Fdiv>\n        <div class=\"mrow\">\n          <div class=\"mbox slate\">Forbedringsforslag<\u002Fdiv>\n          <a class=\"mbox slate-dk link\" href=\"avvikshandbok.html\">Avvik<span class=\"gomark\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m9 18 6-6-6-6\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fa>\n          <div class=\"mbox slate\">Vernerunder<\u002Fdiv>\n          <div class=\"mbox slate\">Risiko<\u002Fdiv>\n          <div class=\"mbox slate\">Revisjoner<\u002Fdiv>\n          <div class=\"mbox slate\">Referat &amp; Rapporter<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Verdikjeder -->\n      <div class=\"mgroup\">\n        <div class=\"mgroup-h\"><span class=\"sw\" style=\"background:var(--sys-red)\"><\u002Fspan><span class=\"lbl\">Verdikjeder<\u002Fspan><span class=\"desc\">Kjernedriften — der vi skaper verdi for kunden.<\u002Fspan><\u002Fdiv>\n        <div class=\"vchain mchain\">\n          <a class=\"vstep red link\" href=\"#transport\" style=\"text-decoration:none\"><span class=\"vt\" style=\"color:#fff\">Transport<\u002Fspan><\u002Fa>\n          <a class=\"vstep red2 link\" href=\"#logistikk\" style=\"text-decoration:none\"><span class=\"vt\" style=\"color:#fff\">Logistikk<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Støtteprosess -->\n      <div class=\"mgroup\">\n        <div class=\"mgroup-h\"><span class=\"sw\" style=\"background:var(--sys-teal)\"><\u002Fspan><span class=\"lbl\">Støtteprosess<\u002Fspan><span class=\"desc\">Funksjonene som holder driften i gang.<\u002Fspan><\u002Fdiv>\n        <div class=\"mrow\">\n          <div class=\"mbox teal\">Alle styrende dokumenter<\u002Fdiv>\n          <div class=\"mbox teal\">Salg &amp; Marked<\u002Fdiv>\n          <div class=\"mbox teal\">HR<\u002Fdiv>\n          <div class=\"mbox teal\">KHMS<\u002Fdiv>\n          <div class=\"mbox teal\">Kundeopplevelse og analyse<\u002Fdiv>\n          <div class=\"mbox teal\">Økonomi<\u002Fdiv>\n          <div class=\"mbox teal\">IT<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Støtteverktøy -->\n      <div class=\"mgroup\">\n        <div class=\"mgroup-h\"><span class=\"sw\" style=\"background:var(--sys-slate)\"><\u002Fspan><span class=\"lbl\">Støtteverktøy<\u002Fspan><span class=\"desc\">Praktiske verktøy for daglig oppfølging.<\u002Fspan><\u002Fdiv>\n        <div class=\"mrow\">\n          <div class=\"mbox slate\">Personell &amp; Kompetanse<\u002Fdiv>\n          <div class=\"mbox slate\">Utstyrskontroll<\u002Fdiv>\n          <div class=\"mbox slate\">Leverandørevaluering<\u002Fdiv>\n          <div class=\"mbox slate\">Personskaderapport<\u002Fdiv>\n          <div class=\"mbox slate\">Avtaleregister<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"mode-note\">\n      <span class=\"icon-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 11l3 3L22 4\"><\u002Fpath><path d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <div><b>Fargekoden er nøkkelen.<\u002Fb><p><b style=\"color:var(--sys-blue)\">Blått<\u002Fb> = strategi · <b style=\"color:#bb8c1c\">gult<\u002Fb> = analyser · <b style=\"color:var(--sys-slate-dk)\">gråblått<\u002Fb> = forbedring &amp; verktøy · <b style=\"color:var(--sys-red)\">rødt<\u002Fb> = verdikjede · <b style=\"color:var(--sys-teal)\">turkis<\u002Fb> = støtteprosess. Boksen <b>Avvik<\u002Fb> er klikkbar — den tar deg til avvikshåndboken.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ KONTINUERLIG FORBEDRING / PDCA ============ -->\n<section class=\"block\" id=\"forbedring\">\n  <div class=\"wrap\">\n    <div class=\"section-head\">\n      <span class=\"kicker\"><span class=\"n\">3<\u002Fspan> Hjertet i systemet<\u002Fspan>\n      <h2 class=\"h2\">Kontinuerlig forbedring — PDCA<\u002Fh2>\n      <p class=\"lead\">De seks modulene under «Kontinuerlig Forbedring» følger et velkjent forbedringshjul: <b>Planlegg → Utfør → Kontrollér → Korrigér<\u002Fb>. Slik blir hverdagens observasjoner til reelle forbedringer.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"pdca\">\n      <div class=\"pcard p1\">\n        <div class=\"pl\">Plan · Planlegg<\u002Fdiv>\n        <h4>Fang opp &amp; planlegg<\u002Fh4>\n        <ul>\n          <li>Forbedringsforslag<\u002Fli>\n          <li>Risiko<\u002Fli>\n        <\u002Ful>\n        <span class=\"big-letter\">P<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"pcard p2\">\n        <div class=\"pl\">Do · Utfør<\u002Fdiv>\n        <h4>Meld &amp; registrér<\u002Fh4>\n        <ul>\n          <li>Avvik<\u002Fli>\n          <li>Vernerunder<\u002Fli>\n        <\u002Ful>\n        <span class=\"big-letter\">D<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"pcard p3\">\n        <div class=\"pl\">Check · Kontrollér<\u002Fdiv>\n        <h4>Kontrollér effekt<\u002Fh4>\n        <ul>\n          <li>Revisjoner<\u002Fli>\n          <li>Referat &amp; rapporter<\u002Fli>\n        <\u002Ful>\n        <span class=\"big-letter\">C<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"pcard p4\">\n        <div class=\"pl\">Act · Korrigér<\u002Fdiv>\n        <h4>Lær &amp; juster<\u002Fh4>\n        <ul>\n          <li>Tiltak settes i verk<\u002Fli>\n          <li>Mater inn i strategien<\u002Fli>\n        <\u002Ful>\n        <span class=\"big-letter\">A<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"xpage\" style=\"margin-top:26px\">\n      <span class=\"icon-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.3 3.2 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.2a2 2 0 0 0-3.4 0z\"><\u002Fpath><path d=\"M12 9v4M12 17h.01\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <div class=\"xt\"><b>Avvik er den mest brukte forbedringsmodulen<\u002Fb><p>Vil du lære nøyaktig hvordan du melder, behandler og lukker et avvik — i tre faser? Den detaljerte håndboken viser deg alt.<\u002Fp><\u002Fdiv>\n      <a class=\"go\" href=\"avvikshandbok.html\">Åpne avvikshåndboken <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"m13 6 6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ VERDIKJEDE TRANSPORT ============ -->\n<section class=\"block alt\" id=\"transport\">\n  <div class=\"wrap\">\n    <div class=\"section-head\">\n      <span class=\"kicker\"><span class=\"n\">4<\u002Fspan> Verdikjede<\u002Fspan>\n      <h2 class=\"h2\">Transport — fra innhenting til evaluering<\u002Fh2>\n      <p class=\"lead\">Transport er den ene av to verdikjeder. Godset følger en fast flyt fra det hentes inn til leveransen er evaluert. <b style=\"color:var(--sys-red)\">Rødt<\u002Fb> = oppstart, <b style=\"color:var(--sys-blue)\">blått<\u002Fb> = gjennomføring, <b style=\"color:var(--sys-green)\">grønt<\u002Fb> = evaluering.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"vchain\">\n      <div class=\"vstep red\"><span class=\"vn\">Steg 1<\u002Fspan><span class=\"vt\">Innhenting<\u002Fspan><\u002Fdiv>\n      <div class=\"vstep red\"><span class=\"vn\">Steg 2<\u002Fspan><span class=\"vt\">Ankomst<\u002Fspan><\u002Fdiv>\n      <div class=\"vstep blue\"><span class=\"vn\">Steg 3<\u002Fspan><span class=\"vt\">Lossing terminal<\u002Fspan><\u002Fdiv>\n      <div class=\"vstep blue\"><span class=\"vn\">Steg 4<\u002Fspan><span class=\"vt\">Lasting &amp; Linehaul<\u002Fspan><\u002Fdiv>\n      <div class=\"vstep blue\"><span class=\"vn\">Steg 5<\u002Fspan><span class=\"vt\">Distribusjon (utkjøring)<\u002Fspan><\u002Fdiv>\n      <div class=\"vstep blue\"><span class=\"vn\">Steg 6<\u002Fspan><span class=\"vt\">Levering &amp; avslutning<\u002Fspan><\u002Fdiv>\n      <div class=\"vstep green\"><span class=\"vn\">Steg 7<\u002Fspan><span class=\"vt\">Evaluering<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"stage-cards\">\n      <div class=\"stage-card\" style=\"--c:var(--sys-red)\"><div class=\"sc-n\">01–02<\u002Fdiv><b>Innhenting &amp; ankomst<\u002Fb><p>Godset hentes inn og ankommer terminal.<\u002Fp><\u002Fdiv>\n      <div class=\"stage-card\" style=\"--c:var(--sys-blue)\"><div class=\"sc-n\">03–04<\u002Fdiv><b>Lossing, lasting &amp; linehaul<\u002Fb><p>Losses, sorteres og fraktes mellom terminaler.<\u002Fp><\u002Fdiv>\n      <div class=\"stage-card\" style=\"--c:var(--sys-blue)\"><div class=\"sc-n\">05–06<\u002Fdiv><b>Distribusjon &amp; levering<\u002Fb><p>Kjøres ut og leveres til sluttkunde.<\u002Fp><\u002Fdiv>\n      <div class=\"stage-card\" style=\"--c:var(--sys-green)\"><div class=\"sc-n\">07<\u002Fdiv><b>Evaluering<\u002Fb><p>Vi måler kvalitet og lærer til neste gang.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <h4 style=\"font-size:15px; margin:28px 0 0\">Dokumenter etter avdeling<\u002Fh4>\n    <div class=\"dept-docs\">\n      <span class=\"dept-chip\">Alle dokumenter · Transport<\u002Fspan>\n      <span class=\"dept-chip\">Agent / Partner / Transportør<\u002Fspan>\n      <span class=\"dept-chip\">Trafikk<\u002Fspan>\n      <span class=\"dept-chip\">Ressursavdeling<\u002Fspan>\n      <span class=\"dept-chip\">Reklamasjon<\u002Fspan>\n      <span class=\"dept-chip\">Ekspedisjon<\u002Fspan>\n      <span class=\"dept-chip\">Terminal<\u002Fspan>\n      <span class=\"dept-chip\">Kjørekontor, parti &amp; linje<\u002Fspan>\n      <span class=\"dept-chip hand\">Sjåførhåndbok<\u002Fspan>\n      <span class=\"dept-chip hand\">Terminalhåndbok<\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"callout green\" style=\"margin-top:22px\">\n      <span class=\"icon-badge green\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"3.6\"><\u002Fcircle><path d=\"M5 20v-1a6 6 0 0 1 12 0v1\"><\u002Fpath><path d=\"m16 11 1.6 1.6L21 9\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <div class=\"ct\"><b>Hvert steg har en prosesseier<\u002Fb><p>Alle stegene i verdikjeden er knyttet til en ansvarlig <b>prosesseier<\u002Fb> — så du alltid vet hvem som eier hvordan oppgaven skal utføres.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ VERDIKJEDE LOGISTIKK ============ -->\n<section class=\"block\" id=\"logistikk\">\n  <div class=\"wrap\">\n    <div class=\"section-head\">\n      <span class=\"kicker\"><span class=\"n\">5<\u002Fspan> Verdikjede<\u002Fspan>\n      <h2 class=\"h2\">Logistikk — fra vareflyt til evaluering<\u002Fh2>\n      <p class=\"lead\">Logistikk (3PL) er den andre verdikjeden. Her styres varene på lageret fra planlegging til utlasting — og avsluttes med evaluering, akkurat som transport.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"vchain\">\n      <div class=\"vstep red\"><span class=\"vn\">Steg 1<\u002Fspan><span class=\"vt\">Planlegge vareflyt<\u002Fspan><\u002Fdiv>\n      <div class=\"vstep blue\"><span class=\"vn\">Steg 2<\u002Fspan><span class=\"vt\">Varemottak<\u002Fspan><\u002Fdiv>\n      <div class=\"vstep blue\"><span class=\"vn\">Steg 3<\u002Fspan><span class=\"vt\">Lagerlegging<\u002Fspan><\u002Fdiv>\n      <div class=\"vstep blue\"><span class=\"vn\">Steg 4<\u002Fspan><span class=\"vt\">Plukkordre<\u002Fspan><\u002Fdiv>\n      <div class=\"vstep blue\"><span class=\"vn\">Steg 5<\u002Fspan><span class=\"vt\">Sammenstilling &amp; utlast<\u002Fspan><\u002Fdiv>\n      <div class=\"vstep green\"><span class=\"vn\">Steg 6<\u002Fspan><span class=\"vt\">Evaluering<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"stage-cards\">\n      <div class=\"stage-card\" style=\"--c:var(--sys-red)\"><div class=\"sc-n\">01<\u002Fdiv><b>Planlegge vareflyt<\u002Fb><p>Vi planlegger hvordan varene skal flyte gjennom lageret.<\u002Fp><\u002Fdiv>\n      <div class=\"stage-card\" style=\"--c:var(--sys-blue)\"><div class=\"sc-n\">02–03<\u002Fdiv><b>Mottak &amp; lagerlegging<\u002Fb><p>Varene tas imot og plasseres på rett plass.<\u002Fp><\u002Fdiv>\n      <div class=\"stage-card\" style=\"--c:var(--sys-blue)\"><div class=\"sc-n\">04–05<\u002Fdiv><b>Plukk &amp; utlast<\u002Fb><p>Ordre plukkes, sammenstilles og sendes ut.<\u002Fp><\u002Fdiv>\n      <div class=\"stage-card\" style=\"--c:var(--sys-green)\"><div class=\"sc-n\">06<\u002Fdiv><b>Evaluering<\u002Fb><p>Vi vurderer presisjon og forbedringspunkter.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <h4 style=\"font-size:15px; margin:28px 0 0\">Dokumenter etter avdeling<\u002Fh4>\n    <div class=\"dept-docs\">\n      <span class=\"dept-chip\">Alle dokumenter · 3PL<\u002Fspan>\n      <span class=\"dept-chip\">Policy og instrukser · 3PL<\u002Fspan>\n      <span class=\"dept-chip\">Prosedyrer · 3PL<\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"callout green\" style=\"margin-top:22px\">\n      <span class=\"icon-badge green\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"3.6\"><\u002Fcircle><path d=\"M5 20v-1a6 6 0 0 1 12 0v1\"><\u002Fpath><path d=\"m16 11 1.6 1.6L21 9\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <div class=\"ct\"><b>Også her: hvert steg har en prosesseier<\u002Fb><p>Som i transport eier en ansvarlig <b>prosesseier<\u002Fb> hvert steg i logistikk-kjeden. Mer om eierskap og dokumenter rett under.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ PROSESSEIER & DOKUMENTER ============ -->\n<section class=\"block alt\" id=\"dokumenter\">\n  <div class=\"wrap\">\n    <div class=\"section-head\">\n      <span class=\"kicker\"><span class=\"n\">6<\u002Fspan> Eierskap &amp; dokumenter<\u002Fspan>\n      <h2 class=\"h2\">Prosesseier — alt har en ansvarlig<\u002Fh2>\n      <p class=\"lead\">Det gjelder ikke bare verdikjedene: hvert eneste dokument i ABMS har en <b>prosesseier<\u002Fb>. Da ser du alltid hvem som er ansvarlig for hvordan noe gjøres — og hvem du spør hvis noe er uklart.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"docs-split\">\n      <div class=\"examples\">\n        <div class=\"ex\">\n          <span class=\"icon-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"3.5\"><\u002Fcircle><path d=\"M5 21v-1a6 6 0 0 1 14 0v1\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <div><b>Prosesseier (Ansvarlig)<\u002Fb><span>Hvert steg og hvert dokument har en navngitt eier i «Ansvarlig»-kolonnen.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ex\">\n          <span class=\"icon-badge green\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m21 21-4.3-4.3\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <div><b>Alt er søkbart<\u002Fb><span>Søk på tvers av hele systemet og filtrer fram akkurat det dokumentet du trenger.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ex\">\n          <span class=\"icon-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 8v4l3 2\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <div><b>Versjonert &amp; sporbart<\u002Fb><span>Opprettet, sist endret og status (f.eks. «Publisert») vises på hvert dokument.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ex\">\n          <span class=\"icon-badge green\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z\"><\u002Fpath><path d=\"M4 19V5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <div><b>Personalhåndboken ligger nå i ABMS<\u002Fb><span>Samlet på ett sted — alltid gjeldende versjon, med egen prosesseier per kapittel.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"shot\">\n        <div class=\"bar\"><span class=\"d\"><\u002Fspan><span class=\"d\"><\u002Fspan><span class=\"d\"><\u002Fspan><span class=\"lbl\">Styrende dokumenter · Personalhåndbok<\u002Fspan><\u002Fdiv>\n        <img src=\"fbd2e98a-0f8d-4d32-b0fe-4ce4a34bd19f\" alt=\"Personalhåndboken i ABMS med søk, Ansvarlig (prosesseier), dokumenttype og status\">\n        <div class=\"cap\">«Ansvarlig» = prosesseier · søkefelt øverst · status og versjon på hver rad.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"mode-note\" style=\"margin-top:26px\">\n      <span class=\"icon-badge green\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <div><b>Kort sagt:<\u002Fb><p>Enten det er et steg i verdikjeden eller et kapittel i personalhåndboken — det finnes alltid en <b>prosesseier<\u002Fb> som er ansvarlig, og du finner dokumentet ved å søke.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ DASHBOARD / MIN SIDE ============ -->\n<section class=\"block\" id=\"dashboard\">\n  <div class=\"wrap\">\n    <div class=\"section-head\">\n      <span class=\"kicker\"><span class=\"n\">7<\u002Fspan> Din inngang<\u002Fspan>\n      <h2 class=\"h2\">Min side — dashbordet ditt<\u002Fh2>\n      <p class=\"lead\">Når du logger inn møter du ditt eget dashbord. Her ser du raskt hva som venter på deg, hva som er mest aktivt i bedriften, og dine egne dokumenter.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"dash-explain\">\n      <div>\n        <div class=\"profile-mock\">\n          <div class=\"pm-head\">\n            <span class=\"pa\">BR<\u002Fspan>\n            <div><div class=\"pn\">Bror<\u002Fdiv><div class=\"pe\">bror.ramberg@ramberg.no<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"pm-item\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"3.5\"><\u002Fcircle><path d=\"M5 21v-1a6 6 0 0 1 14 0v1\"><\u002Fpath><\u002Fsvg> Profil<\u002Fdiv>\n          <div class=\"pm-item\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2 3 7l9 5 9-5z\"><\u002Fpath><path d=\"M3 7v6l9 5 9-5V7\"><\u002Fpath><\u002Fsvg> Kompetanse bruker<\u002Fdiv>\n          <div class=\"pm-item\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4\"><\u002Fpath><path d=\"m16 17 5-5-5-5\"><\u002Fpath><path d=\"M21 12H9\"><\u002Fpath><\u002Fsvg> Logg ut<\u002Fdiv>\n          <div class=\"pm-cust\">Kunder · B. H. Ramberg<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"callout\" style=\"margin-top:16px\">\n          <span class=\"icon-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2 3 7l9 5 9-5z\"><\u002Fpath><path d=\"M3 7v6l9 5 9-5V7\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <div class=\"ct\"><b>Kompetanseprofil<\u002Fb><p>Under profilen finner du din egen kompetanse — kurs, sertifikater og hva du er kvalifisert for.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"dash\">\n        <div class=\"dash-search\">\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m21 21-4.3-4.3\"><\u002Fpath><\u002Fsvg>\n          Søk i hele systemet…\n        <\u002Fdiv>\n\n        <div class=\"dash-stats\">\n          <div class=\"stat-card red\"><div class=\"sk\">Aksjoner som venter på dine innspill<\u002Fdiv><div class=\"sv\">0<\u002Fdiv><div class=\"sf\"><span class=\"pill\">0<\u002Fspan> nye sist uke<\u002Fdiv><\u002Fdiv>\n          <div class=\"stat-card amber\"><div class=\"sk\">Dokumenter som venter på din godkjenning<\u002Fdiv><div class=\"sv\">0<\u002Fdiv><div class=\"sf\"><span class=\"pill\">0<\u002Fspan> nye sist uke<\u002Fdiv><\u002Fdiv>\n          <div class=\"stat-card orange\"><div class=\"sk\">Dine dokumenter under arbeid<\u002Fdiv><div class=\"sv\">21<\u002Fdiv><div class=\"sf\"><span class=\"pill\">1<\u002Fspan> ny sist uke<\u002Fdiv><\u002Fdiv>\n          <div class=\"stat-card green\"><div class=\"sk\">Dokumenter sendt til godkjenning<\u002Fdiv><div class=\"sv\">10<\u002Fdiv><div class=\"sf\"><span class=\"pill\">10<\u002Fspan> nye sist uke<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"dash-grid\">\n          <div class=\"panel chart-scroll\">\n            <h5>Bruksstatistikk · per modul<\u002Fh5>\n            <div class=\"bars\">\n              <div class=\"bar\"><div class=\"col\" style=\"height:1%\"><\u002Fdiv><div class=\"bv\">0<\u002Fdiv><\u002Fdiv>\n              <div class=\"bar hi\"><div class=\"col\" style=\"height:11%\"><\u002Fdiv><div class=\"bv\">26<\u002Fdiv><\u002Fdiv>\n              <div class=\"bar\"><div class=\"col\" style=\"height:1%\"><\u002Fdiv><div class=\"bv\">0<\u002Fdiv><\u002Fdiv>\n              <div class=\"bar\"><div class=\"col\" style=\"height:2%\"><\u002Fdiv><div class=\"bv\">2<\u002Fdiv><\u002Fdiv>\n              <div class=\"bar\"><div class=\"col\" style=\"height:1%\"><\u002Fdiv><div class=\"bv\">0<\u002Fdiv><\u002Fdiv>\n              <div class=\"bar\"><div class=\"col\" style=\"height:1%\"><\u002Fdiv><div class=\"bv\">0<\u002Fdiv><\u002Fdiv>\n              <div class=\"bar\"><div class=\"col\" style=\"height:1.5%\"><\u002Fdiv><div class=\"bv\">1<\u002Fdiv><\u002Fdiv>\n              <div class=\"bar hi\"><div class=\"col\" style=\"height:100%\"><\u002Fdiv><div class=\"bv\">233<\u002Fdiv><\u002Fdiv>\n              <div class=\"bar\"><div class=\"col\" style=\"height:1%\"><\u002Fdiv><div class=\"bv\">0<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"bar-labels\">\n              <span>Avtale­register<\u002Fspan><span>Avvik<\u002Fspan><span>Forbedring<\u002Fspan><span>Leverandør<\u002Fspan><span>Loggen<\u002Fspan><span>Person­skade<\u002Fspan><span>Revisjon<\u002Fspan><span>Styrende dok.<\u002Fspan><span>Verne­runde<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"panel\">\n            <h5>Aktiviteter de siste 5 dagene<\u002Fh5>\n            <div class=\"acts\">\n              <div class=\"act-row\"><span class=\"at\">Selvkjører glemte å sette på brems, skled 20 cm frem<\u002Fspan><span class=\"am\">Avvik<\u002Fspan><\u002Fdiv>\n              <div class=\"act-row\"><span class=\"at\">Utenlandssjåfør kjørte ut fra rampe, uten å være klar<\u002Fspan><span class=\"am\">Avvik<\u002Fspan><\u002Fdiv>\n              <div class=\"act-row\"><span class=\"at\">Gaffeltruck hensatt på lading, med gaflene i hodehøyde<\u002Fspan><span class=\"am\">Avvik<\u002Fspan><\u002Fdiv>\n              <div class=\"act-row\"><span class=\"at\">Lang pall med gods, feilplassert oppå annen pall. Veltet<\u002Fspan><span class=\"am\">Avvik<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"panel\">\n            <h5>Dine favorittdokumenter<\u002Fh5>\n            <div class=\"acts\">\n              <div class=\"fav-row\"><span class=\"ft\">Visjon og strategi<\u002Fspan><span class=\"fm\">Styrende dok.<\u002Fspan><\u002Fdiv>\n              <div class=\"fav-row\"><span class=\"ft\">Prosedyre HR · Datakontroll<\u002Fspan><span class=\"fm\">Styrende dok.<\u002Fspan><\u002Fdiv>\n              <div class=\"fav-row\"><span class=\"ft\">Hovedmeny<\u002Fspan><span class=\"fm\">Hubmeny<\u002Fspan><\u002Fdiv>\n              <div class=\"fav-row\"><span class=\"ft\">Alle dokumenter · 3PL<\u002Fspan><span class=\"fm\">Rapport<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ HVORDAN HENGER ALT SAMMEN ============ -->\n<section class=\"block alt\" id=\"sammenheng\">\n  <div class=\"wrap\">\n    <div class=\"section-head\">\n      <span class=\"kicker\"><span class=\"n\">→<\u002Fspan> Oppsummert<\u002Fspan>\n      <h2 class=\"h2\">Hvordan henger alt sammen?<\u002Fh2>\n      <p class=\"lead\">Fire ledd, én sløyfe. Strategien gir retning, verdikjedene skaper verdi, støtteprosessene holder driften i gang — og kontinuerlig forbedring fører lærdommen tilbake til toppen.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"connect\">\n      <div class=\"cnode c1\">Strategi &amp; mål<\u002Fdiv>\n      <div class=\"cnode c2\">Verdikjeder<\u002Fdiv>\n      <div class=\"cnode c3\">Støtteprosesser<\u002Fdiv>\n      <div class=\"cnode c4\">Kontinuerlig forbedring<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"mode-note\" style=\"margin-top:30px\">\n      <span class=\"icon-badge green\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <div><b>Det viktigste å huske:<\u002Fb><p>Du trenger ikke kunne hele systemet utenat. Vit hvor du hører hjemme i verdikjeden, og bidra til forbedringssløyfen — først og fremst ved å melde avvik når noe ikke er som det skal. Resten finner du i hovedmenyen.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"xpage\" style=\"margin-top:22px\">\n      <span class=\"icon-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3l8 4v5c0 4.5-3.2 7.5-8 9-4.8-1.5-8-4.5-8-9V7z\"><\u002Fpath><path d=\"M9 12l2 2 4-4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <div class=\"xt\"><b>Neste steg: lær avvikshåndtering<\u002Fb><p>Avvik er der du som ansatt bidrar mest til forbedringssløyfen. Håndboken tar deg gjennom alt — for både ansatt og leder.<\u002Fp><\u002Fdiv>\n      <a class=\"go\" href=\"avvikshandbok.html\">Gå til avvikshåndboken <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"m13 6 6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ KONTAKT ============ -->\n<section class=\"block\" id=\"kontakt\">\n  <div class=\"wrap\">\n    <div class=\"contact\">\n      <div class=\"avatar\">BR<\u002Fdiv>\n      <div>\n        <h3>Bror Ramberg<\u002Fh3>\n        <div class=\"role\">Kontaktperson · spørsmål om systemet<\u002Fdiv>\n        <div class=\"rows\">\n          <a href=\"tel:98025401\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.5 2.1L8 9.6a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.8.3 1.7.5 2.6.6a2 2 0 0 1 1.7 2z\"><\u002Fpath><\u002Fsvg> 980 25 401<\u002Fa>\n          <a href=\"mailto:bror@ramberg.no\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"r
